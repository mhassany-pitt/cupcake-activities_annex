- type: explanation
  location:
    snippet: numbers_to_print = 10
  explanations:
  - body: The value '10' is assigned to the variable 'numbers_to_print'
- type: explanation
  location:
    snippet: 'for i in range(1, numbers_to_print + 1):'
  explanations:
  - body: Initializing the for loop. This loop will iterate from i=0 to i=numbers_to_print. When we use 'in range' keywords
      with the for loop, it starts with the first element in the parenthesis and ends with the value one less than the second
      value in the parenthesis. Hence here it starts with the value 1 and ends with the value numbers_to_print
- type: explanation
  location:
    snippet: square = i * i
  explanations:
  - body: squaring the value of 'i'
- type: explanation
  location:
    snippet: print(i, "squared =", square)
  explanations:
  - body: Printing out square of 'i' in each iteration
- type: explanation
  location:
    snippet: print("Done!")
  explanations:
  - body: Once the loop exits, it will print out the string 'Done!'
