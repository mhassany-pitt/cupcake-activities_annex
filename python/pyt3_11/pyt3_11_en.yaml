    snippet: '#Single Line IF...ELSE Condition'
  explanations:
  - body: In python, IF...ELSE Condition can be written in a single line statement for simplicity. This is called as the Pythonic
      way of programming
- type: explanation
  location:
    snippet: number = 100
  explanations:
  - body: Integer 100 is asigned to the variable 'number'
- type: explanation
  location:
    snippet: print("Number less than 100") if (number <= 100) else print("Number Greater than 100")
  explanations:
  - body: 'This statement is read and understood in the following way: Print ''Number less than 100'' if number is less than
      or equal to 100 or else print ''Number Greater than 100''.'
