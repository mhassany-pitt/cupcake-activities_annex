  - body: calling the function 'modify' and passing in the string 'outer_string'. Note that we pass the string to the function
      as a parameter (argument) but we do not save the value returned by the 'modify' function into the main function anywhere
- type: explanation
  location:
    snippet: print(outer_string)
    nth: 2
  explanations:
  - body: printing out the 'out_string'. Here the value of the variable 'out_string' will be the same
