  - body: Defining the main function
- type: explanation
  location:
    snippet: number = 5
  explanations:
  - body: defining the variable 'number'. This is not same as the number variable defined above. Again this variable's scope
      is only confined to this function and hence it is an example of a local variable.
- type: explanation
  location:
    snippet: modify(number)
  explanations:
  - body: now we cll the modify function within the main function and passing the value of number as '5'.
- type: explanation
  location:
    snippet: print("In main function, number is still:", number)
  explanations:
  - body: In the main function the value of variable 'number' is still '5'
