  - body: defining a function called 'modify' which takes in an integer argument 'number'
- type: explanation
  location:
    snippet: number = 10
  explanations:
  - body: Assigning the value '10' to the variable 'number'. Note that th variabe 'number' is the local variable and its scope
      is only confined to this function. What we do here is modify the value of the variable 'number' instead of the using
      the one that is passed as the argument
- type: explanation
