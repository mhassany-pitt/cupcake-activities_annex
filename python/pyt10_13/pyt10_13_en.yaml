elements:
- type: explanation
  location:
    snippet: '#Dictionary Basics'
  explanations:
  - body: |-
      Dictionaries work on key-value pairs. Each key is separated from its value by a colon ':', the items are separated by commas, and the whole thing is enclosed in curly braces. An empty dictionary without any items is written with just two curly braces, like this: {}.

      Keys are unique within a dictionary while values may not be. The values of a dictionary can be of any type, but the keys must be of an immutable data type such as strings, numbers, or tuples.
- type: explanation
  location:
    snippet: 'dictionary1 = {''name'': ''harry'',''age'':14, ''gender'': ''male''}'
  explanations:
  - body: Declaring a dictionary 'dictionary1' with 3 key-value pairs. The keys in this dictionary are 'name', 'age' and 'gender'
- type: explanation
  location:
    snippet: 'dictionary2 = {''name'': ''sal'',''age'':20, ''gender'': ''female''}'
  explanations:
  - body: Similar to above, we declare a dictionary 'dictionary2' with 3 key-value pairs. The keys in this dictionary are
      'name', 'age' and 'gender'
- type: explanation
  location:
    snippet: print(dictionary1,dictionary2)
  explanations:
  - body: printing out both the dictionaries
