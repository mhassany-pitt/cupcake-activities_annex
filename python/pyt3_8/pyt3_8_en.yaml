statement: 'Worked example: Nested IF...ELSE Statement'
elements:
- type: explanation
  location:
    snippet: dice_score = 5
  explanations:
  - body: Assigning the value 5 to the variable 'dice_score'
- type: explanation
  location:
    snippet: 'if dice_score < 6:'
  explanations:
  - body: This is the outer 'If' condition. It checks if the value of 'dice_score' is less than 6. If this condition is true,
      the code will go the the inner 'If...else' conditions. In this case this condition is true since the value of dice_score
      is 5 which is less than 6.
- type: explanation
  location:
    snippet: 'if dice_score == 1:'
  explanations:
  - body: This inner 'If' statement checks if the value is 1. If it is not true, it will jump to the next condition. In this
      case it is not true since the value of dice_score is 5
- type: explanation
  location:
    snippet: 'elif dice_score == 2:'
  explanations:
  - body: This inner 'If' statement checks if the value is 2. If it is not true, it will jump to the next condition. In this
      case it is not true since the value of dice_score is 5
- type: explanation
  location:
    snippet: 'elif dice_score == 3:'
  explanations:
  - body: This inner 'If' statement checks if the value is 3. If it is not true, it will jump to the next condition. In this
      case it is not true since the value of dice_score is 5
- type: explanation
  location:
    snippet: 'elif dice_score == 4:'
  explanations:
  - body: This inner 'If' statement checks if the value is 4. If it is not true, it will jump to the next condition. In this
      case it is not true since the value of dice_score is 5
- type: explanation
  location:
    snippet: 'else:'
  explanations:
  - body: Since all the above conditions are not true it will execute this 'else' statement by default.
- type: explanation
  location:
    snippet: print("Your score is 5. Please roll again.")
  explanations:
  - body: Since the else statement is executed, it will print out this string.
- type: explanation
  location:
    snippet: 'elif dice_score == 6:'
  explanations:
  - body: Imagine if the outer 'If' condition was not true, the code would have jumped to this 'elif' condition.
- type: explanation
  location:
    snippet: 'else:'
    nth: 2
  explanations:
  - body: Again Imagine if none of the above conditions were true, the code would jump to this 'else' condition.
