- type: explanation
  location:
    snippet: '#Bacis Function'
  explanations:
  - body: A function is a block of organized, reusable code that is used to perform a single, related action. Functions provide
      better modularity for your application and a high degree of code reusing.
- type: explanation
  location:
    snippet: 'def test_function():'
  explanations:
  - body: This is how a function is defined. Function begin with the keyword 'def'. Here the function 'test_function' is defined.
      It is followed by empty parenthesis '()' which denotes that no arguments were pased to this function
- type: explanation
  location:
    snippet: test_function()
  explanations:
  - body: This is how a function is called. A function can be simply called by typing the name of the function and then the
      round parenthesis. Once a function is called, everything within the function is executed. In this case the 2 print statements
      will be executed
