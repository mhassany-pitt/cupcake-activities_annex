  explanations:
  - body: There are 5 elements in the list and the for loop runs for 10 iterations. So, from iteration numer 6 onwards the
      try block will not find elements at the given index. This statement means that if there are no elements at the index
      that we are searching then we manually pass an integer argument by calling the function definition. Here instead of
      raising an error, we customized the fail-safe.
