- type: explanation
  location:
    snippet: 'class Child(Parent): # define child class'
  explanations:
  - body: Now we define a 'Child' class. Here we pass 'Parent' as an argument. This is the core concept of inheritance. Instead
      of starting from scratch, you can create a class by deriving it from a preexisting class by listing the parent class
      in parentheses after the new class name.The child class inherits the attributes of its parent class, and you can use
      those attributes as if they were defined in the child class. A child class can also override data members and methods
      from the parent.
