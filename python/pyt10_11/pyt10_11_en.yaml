- type: explanation
  location:
    snippet: print("User's Full Name is {} {}.".format("John", "Adams"))
  explanations:
  - body: This statement formats the output. The .format functions says that we are formatting the string so it will look
      for '{}' signs in the string. Then we have a tuple at the end which contans two string values - 'John' and 'Adams' which
      we are passing to it. So in the first '{}' sign, the string 'John' will be passed and in the second '{}' sign, the string
      'Adams' will be passed. The output you will see on running this code is "User's Full Name is John Adams."
