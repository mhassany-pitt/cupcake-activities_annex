  - body: In this statement integer '10' is assigned to the variable 'number'
- type: explanation
  location:
    snippet: 'if number > 5:'
  explanations:
  - body: This statement checks if the variable 'number' has a value greater than '5'. If this condition is true, it will
      go inside the loop to execute the statement. If the condition is not true it will skip the IF statement.
- type: explanation
  location:
    snippet: print(True)
  explanations:
  - body: |-
      If the above condition is true, it will print out the boolean 'True'. In this case it will print out True.
      Note: A boolean value is not a string and hence it should not be inside quotation marks.
