elements:
- type: explanation
  location:
    snippet: '#Accessing and modifying Dictionary Elements'
  explanations:
  - body: This example deals with adding elements as well as modifying elements of a dictionary
- type: explanation
  location:
    snippet: 'dict = {"Name": "Terry", "score1": 80}'
  explanations:
  - body: Defining a dictionary with 3 key-value pairs
- type: explanation
  location:
    snippet: dict["score1"] = dict["score1"] + 10
  explanations:
  - body: This statement deals with modifying the value of one of the element. The value of the key 'score1' was added by
      10
- type: explanation
  location:
    snippet: dict["score2"] = 92
  explanations:
  - body: This statement adds a new element to the dictionary whose key is 'score2' and value is '92'
- type: explanation
  location:
    snippet: print(dict["score2"])
  explanations:
  - body: Print the value of the element 'score2'
- type: explanation
  location:
    snippet: print(len(dict))
  explanations:
  - body: This statement prints the lendth of the dictionary. Length of a dictionary simply means number of key-value pairs
      present in a dictionary. In this case after adding one additional element in the above statement, we now have 3 elements.
      So the length of the dictionary is 3
