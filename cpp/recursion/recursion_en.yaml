elements:
- type: explanation
  location:
    snippet: long factorial( long );
  explanations:
  - body: recursive definition of function factorial.
- type: explanation
  location:
    snippet: for ( i = 1; i <= 10; i++ )
  explanations:
  - body: loop 11 times; during each iteration, calculate factorial( i ) and display result.
- type: explanation
  location:
    snippet: long factorial( long number )
  explanations:
  - body: recursive definition of function factorial.
- type: explanation
  location:
    snippet: if ( number <= 1 )
  explanations:
  - body: base case. If number is less than or equal to 1, factorial returns 1, no further recursion is necessary.
- type: explanation
  location:
    snippet: else
  explanations:
  - body: recursive step. If number is greater than 1, the statement expresses the problem as   the product of number and
      a recursive call to factorial evaluating the factorial of number-1.
