statement: For Loop
elements:
- type: explanation
  location:
    snippet: for(int i=1; i<11; i++){
  explanations:
  - body: "The for statement provides a compact way to iterate over a range of values. There are three things included inside\
      \ the parentheses, initialization, \r\ntermination and increment/decrement. The initialization \r\nexpression initializes\
      \ the loop; it's executed once, as the loop begins. \r\nWhen the termination expression evaluates to false, the loop\
      \ terminates. \r\nThe increment expression is invoked after each iteration through the loop. \r\nHere, an integer i\
      \ is initialized to 1. After each iteration, i increases 1. \r\nOnce i reaches 11, the termination expression becomes\
      \ false. The loop \r\nterminates."
- type: explanation
  location:
    snippet: 'System.out.println("Count is: " + i);'
  explanations:
  - body: "Inside the for loop, each iteration will print a line which consists the string literal \"Count is: \" and the\
      \ value of i. The print out will be 10 lines, the first \r\nis \"Count is: 1\", the second line is \"Count is: 2\",\
      \ and so forth until the the last line that which is \"Count is: 10\""
