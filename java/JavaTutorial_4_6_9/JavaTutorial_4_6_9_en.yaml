- type: explanation
  location:
    snippet: for (int i = 1; i <= limit;) {
  explanations:
  - body: "Elements on the for statement can be omitted. In this case the \r\nincrement or decrement element is omitted (note\
      \ there is no \r\nexpression after the second \";\")"
- type: explanation
  location:
    snippet: sum += i++;
  explanations:
  - body: "The operation '+=' adds the value of the 'i' to the 'sum' and then \r\nstore the new value in the variable 'sum'.\
      \ After that, the \r\nvariable 'i' is incremented by 1."
