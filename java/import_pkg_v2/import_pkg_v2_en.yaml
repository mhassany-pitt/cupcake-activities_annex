elements:
- type: explanation
  location:
    snippet: import edu.pitt.sis.is17.*;
  explanations:
  - body: the keyword import is used to import classes from packages. It allows you to refer to a class of a package by its
      class name, without the package prefix. This line, we imported all the classes from edu.pitt.sis.is17 package.
- type: explanation
  location:
    snippet: import java.util.ArrayList;
  explanations:
  - body: if you want to use a class from a package, you can refer to it by using the full name(package name plus class name).
      This line imports the ArrayList class from java.util package.
