elements:
- type: explanation
  location:
    snippet: while (count < 11) {
  explanations:
  - body: "while statement allows you to execute a piece of code several times, while a certain condition is true. In this\
      \ case we execute a block of statements while 'count' is less than 11\r\nwhile-loop is a loop with pre-condition, which\
      \ means it checks for the condition before going into the loop"
- type: explanation
  location:
    snippet: 'System.out.println("Count is: " + count);'
  explanations:
  - body: on every step of the loop we print the current value of 'count'...
- type: explanation
  location:
    snippet: count++;
  explanations:
  - body: and then we increment the value of 'count' by 1.Hence, this loop  will execute 10 times and it will print 1,2,3....9,10.On
      the last step after it prints 10, and increase 'count' to 11 the 'while'-condition becomes false, since 'count' is not
      lees then 11 any more. And the loop stops.
- type: explanation
  location:
    snippet: '}'
  explanations:
  - body: end of the while-loop
