elements:
- type: explanation
  location:
    snippet: String b = a.substring(5,7);
  explanations:
  - body: "substring() method returns the sub-string between its input parameters. The \r\nfirst parameter is the start position\
      \ (here equals to 5) and the second input \r\nparameter is the end position (here equals to 7). Here the string variable\
      \ b is \r\ninitialized with \"is\"."
- type: explanation
  location:
    snippet: b = "Java is great.".substring(5,7);
  explanations:
  - body: "substring() method can be called by a string literal as well. Again, the string \r\nvariable b is initialized with\
      \ \"is\"."
