  - body: Get user input for his/her age
- type: explanation
  location:
    snippet: if (age >= 21) {
  explanations:
  - body: The user can enter if s/he is at least 21
- type: explanation
  location:
    snippet: '} else {'
  explanations:
  - body: If the user is not at least 21, show an error message
- type: explanation
  location:
    snippet: if (age >= 13) {
  explanations:
  - body: Show a PG-13 rated error message
- type: explanation
  location:
    snippet: '} else {'
    nth: 2
  explanations:
  - body: Show a G rated error message
- type: explanation
  location:
    snippet: System.out.println("Come back in " + (21 - age) + " years :)");
  explanations:
  - body: This line runs regardless of which error message was shown.
