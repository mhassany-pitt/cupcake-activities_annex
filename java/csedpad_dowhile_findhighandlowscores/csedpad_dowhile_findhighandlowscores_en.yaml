elements:
- type: explanation
  location:
    snippet: do {
  explanations:
  - body: Unlike while and for loops, the body of a do-while loop executes first, before a conditional is checked.
- type: explanation
  location:
    snippet: '} while (i < SCORES.length);'
  explanations:
  - body: Check the conditional (i < SCORES.length), and if it evaluates to true, repeat the loop body; otherwise, if it evaluates
      to false, drop out of the loop. Note that a semicolon (;) must be placed on the end of a do-while loop -- it is easy
      to forget!
