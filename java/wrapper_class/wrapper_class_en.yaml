  - body: Declares an ArrayList AL to store objects.
- type: explanation
  location:
    snippet: AL.add(new Integer(1));
  explanations:
  - body: ArrayLists only store references. For each of the eight primitive data types in Java there is a matching "wrapper
      class" that can be used to store a value of that type.
- type: explanation
  location:
    snippet: Integer iw =(Integer) AL.get(i);
  explanations:
  - body: When you want to retrieve the values wrapped up in the Integers that are in the ArrayList elements you will need
      to cast the elements back to Integers
