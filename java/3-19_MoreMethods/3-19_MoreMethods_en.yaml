elements:
- type: explanation
  location:
    snippet: public static double max(double a, double b, double c) {
  explanations:
  - body: This method returns the maximum of its three parameters.
- type: explanation
  location:
    snippet: if (a >= b && a >= c)
  explanations:
  - body: We use >= instead of > to account for situations where two or more parameters are the same
- type: explanation
  location:
    snippet: public static int factorial(int n) {
  explanations:
  - body: Recursively returns the factorial of n.
- type: explanation
  location:
    snippet: if (n == 0)
  explanations:
  - body: Base case - every recursive method must have at least one of these!
- type: explanation
  location:
    snippet: return n*factorial(n-1);
  explanations:
  - body: For example, 5! = 5*4!, 4! = 4*3!, and so on
- type: explanation
  location:
    snippet: if (n == 0)
    nth: 2
  explanations:
  - body: 'Two base cases: n = 0 and n = 1'
- type: explanation
  location:
    snippet: else
  explanations:
  - body: n must be >= 2 for this to work, since it requires adding the two previous values
