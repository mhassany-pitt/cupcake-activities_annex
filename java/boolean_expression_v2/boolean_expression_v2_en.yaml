elements:
- type: explanation
  location:
    snippet: flag = 5 < 6;
  explanations:
  - body: The operator < evaluates if the right-hand side number is bigger than the left-hand side number. Since 5 is less
      than 6, the expression "5 < 6" is true. So, the value of variable flag is equal to true.
- type: explanation
  location:
    snippet: flag = 5 > 6;
  explanations:
  - body: The value of variable flag is now false.
