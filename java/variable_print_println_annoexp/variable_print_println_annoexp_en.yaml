  - body: Declares a variable named 'width' and initializes it with integer 10.
- type: explanation
  location:
    snippet: System.out.print(width);
  explanations:
  - body: |-
      So far, the console output is as follows (note that there is a space before 10):
      width: 10
- type: explanation
  location:
    snippet: System.out.println();
