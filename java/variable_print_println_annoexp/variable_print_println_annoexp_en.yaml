      width: 20
      width: 30
- type: explanation
  location:
    snippet: System.out.println();
    nth: 2
  explanations:
  - body: The cursor moves to the start of the next new line.
- type: explanation
  location:
    snippet: width = width + 10;
  explanations:
  - body: The same variable can occur on both sides of an assignment. In this case, the left side width represents the older
      value of width (30), and the right side width represents the final value of width (40)
