  location:
    snippet: 'System.out.print("width: ");'
  explanations:
  - body: |-
      So far, the console output is as follows:
      width: 10
      width:
- type: explanation
  location:
    snippet: System.out.println(width);
  explanations:
  - body: |-
      So far, the console output is as follows (note that it prints a new line directly after 20):
      width: 10
      width: 20
- type: explanation
  location:
    snippet: width = height + 10;
  explanations:
  - body: The right hand side of an assignment can be an expression. Now width is set to 20+10=30.
- type: explanation
  location:
    snippet: 'System.out.print("width: ");'
    nth: 2
  explanations:
  - body: |-
      So far, the console output is as follows:width: 10
      width: 20
      width:
- type: explanation
  location:
