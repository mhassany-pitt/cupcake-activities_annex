- type: explanation
  location:
    snippet: '}'
  explanations:
  - body: Column named sid, which is character domain type, has 20 digit space and does not allow NULL value. <br><br>In the
      body of the CREATE TABLE clause, the columns of the newly created table are defined. Column definition should be started
      with the round parenthesis. Firstly, every column in the table must have a unique name, but the names may duplicate
      those of columns in other tables. Secondly, domain name is to identify the kind of data that the column stores. This
      additional information is enclosed in parenthesis following the keyword that specifies the data type. Lastly, required
      data is to determine whether the column contains required data and prevents NULL values from appearing in the column;
      otherwise, NULL values are allowed.
