elements:
- type: explanation
  location:
    snippet: import java.util.ArrayList;
  explanations:
  - body: "this line imports the ArrayList class from java.util \r\npackage."
- type: explanation
  location:
    snippet: public class Wrapper{
  explanations:
  - body: "This example shows how to store sequence of \r\nnumbers in the ArrayList. To store sequences \r\nof numbers in\
      \ an array list, you must turn \r\nthem into objects by using \r\nwrapper classes. There are wrapper classes \r\nfor\
      \ all eight primitive types. The \r\nwrapper \r\nclass names start with uppercase letters, and \r\nthat two of them\
      \ differ from the \r\nnames of the corresponding primitive type: \r\nInteger and Character. Each wrapper class \r\n\
      object contains a value of the \r\ncorresponding primitive type."
- type: explanation
  location:
    snippet: ArrayList<Integer> AL = new ArrayList<Integer>();
  explanations:
  - body: "Declares an ArrayList AL to store Integer \r\nobjects."
- type: explanation
  location:
    snippet: AL.add(new Integer(1));
  explanations:
  - body: "Here, an object of the class Integer that \r\ncontains a value of type int is created and \r\nadded to the list."
- type: explanation
  location:
    snippet: AL.add(2);
  explanations:
  - body: "Conversion between primitive types and the \r\ncorresponding wrapper classes is automatic. \r\nThis process is\
      \ called 'auto-boxing'. \r\nHere, 2 is automatically converted to the \r\nwrapper class Integer that contains 2 \r\n\
      and then the reference of the wrapper class is \r\nadded to the list."
- type: explanation
  location:
    snippet: int x = AL.get(i);
  explanations:
  - body: "Wrapper objects are also automatically \r\nunboxed to primitive types. This conversion is \r\ncalled 'unboxing'."
- type: explanation
  location:
    snippet: System.out.println(x);
  explanations:
  - body: prints the element at index i.
- type: explanation
  location:
    snippet: '}'
  explanations:
  - body: "by the end of the for loop, '1' and '2' are printed \r\nin the first and second line respectively."
