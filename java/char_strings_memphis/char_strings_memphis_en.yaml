statement: Some demos of working with the char and String data types.
elements:
- type: explanation
  location:
    snippet: System.out.println(x);
  explanations:
  - body: Shows A
- type: explanation
  location:
    snippet: System.out.println(y);
  explanations:
  - body: Shows 0
- type: explanation
  location:
    snippet: System.out.println((int)x);
  explanations:
  - body: Casting a char value to int converts it to its Unicode value - this shows 65
- type: explanation
  location:
    snippet: System.out.println((int)y);
  explanations:
  - body: Shows 48 (which is the Unicode value of '0')
- type: explanation
  location:
    snippet: System.out.println(x + y);
  explanations:
  - body: Adds the Unicode values numerically
- type: explanation
  location:
    snippet: System.out.println((char)65);
  explanations:
  - body: Shows A, since it treats the Unicode value 65 as a char
- type: explanation
  location:
    snippet: System.out.println((char)65.9);
  explanations:
  - body: Also shows A - it truncates the .9 and treats the Unicode value 65 as a char
- type: explanation
  location:
    snippet: System.out.println(something + something2);
  explanations:
  - body: This is string concatenation, which combines multiple strings into a longer string
- type: explanation
  location:
    snippet: String name = in.nextLine();
  explanations:
  - body: Use next() to read the next word of input, or nextLine() to read the entire line
