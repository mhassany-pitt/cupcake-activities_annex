runtime:
  language: java
  version: '17'
statement: The code below demonstrates how to swap the values of x and y, and perform some casting operations to convert variables
  from one data type into another
elements:
- type: explanation
  location:
    snippet: int x = 4, y = 10;
  explanations:
  - body: Declares two int variables named x and y, and assigns them values of 4 and 10, respectively
- type: explanation
  location:
    snippet: System.out.println(x + ", " + y);
  explanations:
  - body: Shows 4, 10
- type: explanation
  location:
    snippet: x = y;
  explanations:
  - body: This line does *not* mean that x and y are always the same!  It simply says "store the value of y into the variable
      x, once"
- type: explanation
  location:
    snippet: System.out.println(x + ", " + y);
    nth: 2
  explanations:
  - body: Shows 10, 10
- type: explanation
  location:
    snippet: y = 8;
  explanations:
  - body: This line changes y into 8, but x is unaffected
- type: explanation
  location:
    snippet: System.out.println(x + ", " + y);
    nth: 3
  explanations:
  - body: Shows 10, 8
- type: explanation
  location:
    snippet: int temp = x;
  explanations:
  - body: Create a new variable named temp to store the old value of x
- type: explanation
  location:
    snippet: x = y;
    nth: 2
  explanations:
  - body: Replace x with the value of y
- type: explanation
  location:
    snippet: y = temp;
  explanations:
  - body: Replace y with the value of temp (which is the old value of x)
- type: explanation
  location:
    snippet: double z = 2;
  explanations:
  - body: implicit cast (z will hold the value of 2.0)
- type: explanation
  location:
    snippet: int z1 = (int)2.5;
  explanations:
  - body: explicit cast required (z1 will hold the value of 2)
- type: explanation
  location:
    snippet: byte small = (byte)200;
  explanations:
  - body: explicit cast required (small will the last 8 bits of the int value 200)
