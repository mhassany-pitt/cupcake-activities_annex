- type: explanation
  location:
    snippet: if (++value % 2 == 0 && ++count < limit) {
  explanations:
  - body: "The && (AND) operator is used to indicate that both conditions (at the right and left sides of the &&) must be\
      \ met. \r\nIncremental operator \"++\" put before the variable makes the increment before the rest of \r\noperations\
      \ is computed. The modulus operator (\"%\") computes the rest of the integer quotient \r\nbetween \"value\" and 2. Here\
      \ it is testing if value is an even number. Since \"++\" is put before, \r\nthe value is incremented to 9 and then the\
      \ modulus 2 gives the value 1, and the condition is \r\nnot met."
