elements:
- type: explanation
  location:
    snippet: switch (x) {
  explanations:
  - body: The switch statement can work on any int or String value.
- type: explanation
  location:
    snippet: 'case 2:'
  explanations:
  - body: Find the first case that matches x's value, then run all actions until either a break or the end of the switch block
      is reached.
- type: explanation
  location:
    snippet: 'default:'
  explanations:
  - body: The default case runs if *none* of the preceding cases have been met.
