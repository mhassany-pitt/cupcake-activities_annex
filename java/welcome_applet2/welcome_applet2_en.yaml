elements:
- type: explanation
  location:
    snippet: import javax.swing.JApplet;  // import class JApplet
  explanations:
  - body: "import statements tell compiler where to locate classes used\r\nWhen you create applets, import the JApplet class\
      \ (package javax.swing)"
- type: explanation
  location:
    snippet: import java.awt.Graphics;    // import class Graphics
  explanations:
  - body: "import the Graphics class (package java.awt) to draw graphics \r\nCan draw lines, rectangles ovals, strings of\
      \ characters"
- type: explanation
  location:
    snippet: public class WelcomeApplet2 extends JApplet {
  explanations:
  - body: "Begins class definition for class WelcomeApplet\r\nextends followed by class name\r\nIndicates the class to inherit\
      \ from (JApplet)\r\nWelcomeApplet now has methods and data of JApplet"
- type: explanation
  location:
    snippet: public void paint( Graphics g )
  explanations:
  - body: "Our class inherits method paint from JApplet\r\nvoid means paint returns nothing when it finishes its task\r\n\
      paint gets parameters automatically"
- type: explanation
  location:
    snippet: g.drawString( "Welcome to", 25, 25 );
  explanations:
  - body: The two drawString statements simulate a newline.  In fact, the concept of lines of text does not exist when drawing
      strings.
- type: explanation
  location:
    snippet: g.drawString( "Java Programming!", 25, 40 );
  explanations:
  - body: The two drawString statements simulate a newline.  In fact, the concept of lines of text does not exist when drawing
      strings.
