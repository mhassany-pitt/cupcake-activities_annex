  (1-29) Casting values, using Scanner (change making program, pet store checkout) PetStore.java

  Program that demonstrates using Scanner to read user input -- simulates checkout from an online pet store.
elements:
- type: explanation
  location:
    snippet: "final double \tDOG_PRICE = 50,"
  explanations:
  - body: |-
      Variables that are declared with final are constants -- they can be given an initial value, but that value can't be changed later in the program.

      The Java convention for naming constants is CONSTANT_NAME (unlike the convention for variableName)
- type: explanation
  location:
    snippet: SLOTH_PRICE = 900018293028L,
  explanations:
  - body: The L indicates this is a long value -- needed since it's too large to fit into the int data type
- type: explanation
  location:
    snippet: System.out.println("Welcome to the finest pet store in the land!");
  explanations:
  - body: Show a menu of pets to buy
- type: explanation
  location:
    snippet: System.out.println("How many dogs would you like to buy?");
  explanations:
  - body: Get user input for quantity of each pet to buy
- type: explanation
  location:
    snippet: double subtotal = dogs*DOG_PRICE + dragons*DRAGON_PRICE + sloths*SLOTH_PRICE + babyMonkeys*BABY_MONKEY_PRICE
      + amoebas*AMOEBA_PRICE;
  explanations:
  - body: Compute the subtotal (without tax)
- type: explanation
  location:
    snippet: double tax = subtotal*.0925;
  explanations:
  - body: The tax is 9.25 percent of the subtotal
- type: explanation
  location:
    snippet: double total = subtotal + tax;
  explanations:
  - body: The total is the sum of the subtotal and tax
- type: explanation
  location:
    snippet: System.out.println("Subtotal:\t\t$" + subtotal);
  explanations:
  - body: Print the subtotal, tax, and total
