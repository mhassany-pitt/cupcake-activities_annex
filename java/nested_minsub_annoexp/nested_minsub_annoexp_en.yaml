statement: Simple Nested Loop for NestedStatement
elements:
- type: explanation
  location:
    snippet: for(int i = 0; i < 5; i++)
  explanations:
  - body: The outer for loop starts with i equals to 0. It increases 1 for each iteration and terminates when it reaches 4.
- type: explanation
  location:
    snippet: for(int j = 0; j < 4; j++)
  explanations:
  - body: For each value of i, the inner for loop starts with j equals to 0, and increases j by 1 for each iteration and terminates
      when it reaches 3.
- type: explanation
  location:
    snippet: result = j;
  explanations:
  - body: Here the value of result only depends on the value of j. When i reaches the maximum value 4 and j reaches the maximum
      value 3, result is set to 3, and both loops end. The final value of result is 3.
