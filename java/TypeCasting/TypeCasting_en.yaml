statement: 'Worked example: DEPRECATED_Type Casting'
elements:
- type: explanation
  location:
    snippet: float f = (float) d;
  explanations:
  - body: a double value cannot be directly assigned to a float variable. Typecasting is required
- type: explanation
  location:
    snippet: int i = (int) d;
  explanations:
  - body: To assign double or float value to a a variable of an integer type you need to typecast this value. This will truncate
      the floating part of the double value.
- type: explanation
  location:
    snippet: byte b = (byte) i;
  explanations:
  - body: To convert from a longer integer type to a shorter integer type a typecasting is also required. As in all cases
      above some information can be lost. For example here if the value of i is not between -128 and 127, the resulting value
      of b will be different from the expected.
