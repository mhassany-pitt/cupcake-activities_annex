elements:
- type: explanation
  location:
    snippet: if (s1.equals(s2))
  explanations:
  - body: Use the .equals() method to compare strings for equality.Here, we are comparing s1 and s2 strings. If s1 is equal
      to s2, the next command will be executed.
- type: explanation
  location:
    snippet: System.out.println("these two are equal!");
  explanations:
  - body: However, s1(Hell) is not equal to s2(Hello), this line will never be printed out.
- type: explanation
  location:
    snippet: System.out.println(s1.compareTo(s2));
  explanations:
  - body: The compareTo method compares strings is dictionary order.  Here, s1(Hell) is 1 letter less than (Hello). So the
      print out is -1.
- type: explanation
  location:
    snippet: System.out.println(s3.compareTo(s1));
  explanations:
  - body: The compareTo method compares strings is dictionary order.  Here, s3(Hello IS17) has 6 letters more than s1(Hell).
      So the print out is 6.
- type: explanation
  location:
    snippet: System.out.println(s1.compareTo(s4));
  explanations:
  - body: The compareTo method compares strings is dictionary order.  Here, s1 and s4 are identical. Both are string Hell.
      So the print out is 0.
