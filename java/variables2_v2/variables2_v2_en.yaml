statement: Variable Initialization
elements:
- type: explanation
  location:
    snippet: int i = 2;
  explanations:
  - body: "Variable initialization is used to declare a variable and immediately assign \r\nan initial value to it. This statement\
      \ declares an integer variable named 'i' \r\nand assign it with integer 2."
- type: explanation
  location:
    snippet: String sentence = "I am a teacher.";
  explanations:
  - body: "String variables are initialized with string literals. Here variable 'sentence' is \r\ninitialized with 'I am a\
      \ teacher.'."
- type: explanation
  location:
    snippet: int a = 2, b = 3;
  explanations:
  - body: Several variables of the same type can be initialized in one statement.
- type: explanation
  location:
    snippet: int i =  2 * 3 + 5;
  explanations:
  - body: "You can initialize a variable with the result of an expression. Here, the \r\ninteger variable 'i' is initialized\
      \ with value 11."
