elements:
- type: explanation
  location:
    snippet: if((value1 == 1) && (value2 == 2)) System.out.println("value1 is 1 AND value2 is 2");
  explanations:
  - body: "Operator && is the logic AND, and is used to combine conditions. It evaluates to true only if \r\nboth conditions\
      \ are true.\r\nIf any or both conditions are false, the entire \r\n&&-condition is false."
- type: explanation
  location:
    snippet: if((value1 == 1) || (value2 == 1)) System.out.println("value1 is 1 OR value2 is 1");
  explanations:
  - body: "Operator || is the logic OR and is used to combine conditions. It evaluates to true if any \r\nor both conditions\
      \ are true.\r\nOnly if both conditions are false, the entire ||-\r\ncondition is false."
