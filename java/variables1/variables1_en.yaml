    snippet: int i, j;
  explanations:
  - body: A variable declaration always begins with a type and ends with a semicolon.  here, the type is integer. variables
      are i and j.
- type: explanation
  location:
    snippet: String sentence;
  explanations:
  - body: The type is used to identify the kind of data that will be stored in the memory location associated with the variable
      being declared.
- type: explanation
  location:
    snippet: double a, b;
  explanations:
  - body: you can declare several variables of the same type by separating the names with a comma. here, the type is double.
      variables are a and b.
