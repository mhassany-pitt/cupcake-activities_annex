    snippet: System.out.println( c );
    nth: 3
  explanations:
  - body: Prints 4.
- type: explanation
  location:
    snippet: System.out.println( --c );
  explanations:
  - body: This line first decrements the value of variable 'c' and then prints it. Hence, it'll print 3.
