elements:
- type: explanation
  location:
    snippet: 'System.out.printf("temperature : %.2f %s %c", temp," deg ",scale);'
  explanations:
  - body: the formatted output is used to print only up to two decimal places of the temperature for double
- type: explanation
  location:
    snippet: if(scale=='C'){
  explanations:
  - body: if the scale equals 'C', the first block(if condition) is executed which converts the temp to 'F' scale using the
      formula.
- type: explanation
  location:
    snippet: '}else if(scale==''F''){'
  explanations:
  - body: If the scale equals 'F' then the second block(else if) will be executed which will convert the temperature to 'C'
      scale.
- type: explanation
  location:
    snippet: System.out.println("Now a valid temperature scale");
  explanations:
  - body: If the scale equals neither, then the third block(else) is executed which prints 'Now a valid temperature scale'
