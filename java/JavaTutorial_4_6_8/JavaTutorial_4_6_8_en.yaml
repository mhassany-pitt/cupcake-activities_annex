elements:
- type: explanation
  location:
    snippet: for (int i = 0, j = 0; i < 5; i++, j--)
  explanations:
  - body: "Two variables (i, j) are defined in the for statement. While 'i' is incremented \r\nin each round, 'j' is decremented."
- type: explanation
  location:
    snippet: System.out.println("i = " + i + " j= " + j);
  explanations:
  - body: "First it prints \"i = 0 j = 0\". Next round it prints: \"i = 1 j = -1\". 3rd round: \r\n\"i = 2 j = -2\". \r\n\
      and so on, until i=5"
