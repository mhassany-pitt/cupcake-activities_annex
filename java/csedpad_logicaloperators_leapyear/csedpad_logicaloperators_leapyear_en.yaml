statement: This program checks whether a year is a leap year or not
elements:
- type: explanation
  location:
    snippet: 'leapYear = (year % 400 == 0) || ((year % 4 == 0) && (year % 100 != 0)) ? "It''s a leap Year": "Not a Leap year!";'
  explanations:
  - body: The ternary operator '?:' is used to check the whether the year is leap year of not. in a ternary operator all the
      statement until ? represents a condition . for example '(year % 400 == 0) || ((year % 4 == 0) && (year % 100 != 0))'
      represents a condition under evaluation if the condition evaluates true then value between '?' and ':' will be assigned
      to the variable leapYear else the value between ':' and ';' will e assigned to the variable leapYear
