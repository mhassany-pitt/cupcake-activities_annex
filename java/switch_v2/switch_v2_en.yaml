statement: switch
elements:
- type: explanation
  location:
    snippet: switch (springMonth ) {
  explanations:
  - body: "switch statement allows to implement selection. It has a selection variable ('springMonth' in our case) and it\
      \ \r\ncompares it against the possible cases until it finds a \r\nmatching case."
- type: explanation
  location:
    snippet: 'case 1:  System.out.println("March"); break;'
  explanations:
  - body: "The 'case' clause compares springMonth with a value. Here 'case' compares with 1. If the value of \r\n'springMonth'\
      \ is 1, two things happen: the program \r\nprints \"March\" and then it leaves the switch statement \r\n(this is what\
      \ 'break' is for)"
- type: explanation
  location:
    snippet: 'case 2:  System.out.println("April"); break;'
  explanations:
  - body: "If the value of 'springMonth' is 2, the program prints \"April\" and leaves the switch statement. This is what\
      \ \r\nhappens in this program."
- type: explanation
  location:
    snippet: 'case 3:  System.out.println("May"); break;'
  explanations:
  - body: "If the value of 'springMonth' is 3 the program prints \"May\" and leaves the switch statement.In our case the \r\
      \nprogram  will never get to this point, since it'll leave \r\nswitch statement in the previous case."
- type: explanation
  location:
    snippet: 'default: System.out.println("Invalid month"); break;'
  explanations:
  - body: "if the selection variable matches none of the cases it will match the 'default' case and execute the code \r\n\
      after 'default'.'default' can be omitted -in this case \r\nnothing happens for the unmatched cases."
