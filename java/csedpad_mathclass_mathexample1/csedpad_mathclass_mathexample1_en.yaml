statement: Demonstrate the understanding of Math class concepts by constructing a program that finds the length of the hypotenuse
  in of a right triangle by using the Pythagoras theorem then finds the angles of that triangle.
elements:
- type: explanation
  location:
    snippet: c = Math.sqrt(Math.pow(a, 2) + Math.pow(b, 2));
  explanations:
  - body: Assign the result of sqr root of a^2 + b^2 to c
- type: explanation
  location:
    snippet: double A = Math.acos((b * b + c * c - a * a) / (2 * b * c));
  explanations:
  - body: Initialize the variables A to the value of arc cosine((b * b + c * c - a * a) / (2 * b * c))
- type: explanation
  location:
    snippet: A = (A * 180) / Math.PI;
  explanations:
  - body: Assign the variable A to the value of (A * 180) divided by PI
- type: explanation
  location:
    snippet: double B = Math.acos((a * a + c * c - b * b) / (2 * a * c));
  explanations:
  - body: Initialize the variables B to the value of arc cosine((a * a + c * c - b * b) / (2 * a * c))
- type: explanation
  location:
    snippet: B = (B * 180) / Math.PI;
  explanations:
  - body: Assign the variable B to the value of (B * 180) divided by PI
