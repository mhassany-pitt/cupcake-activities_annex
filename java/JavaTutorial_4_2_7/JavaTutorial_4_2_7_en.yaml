    snippet: if (a == 2) {
  explanations:
  - body: "This if statement is nested inside another if. Variable \"a\" has the value 2, however, since this is part of the\
      \ statements \r\nincluded inside the if (a == 0), this if is never executed. This \r\nexample is aimed to show that\
      \ inside a block you can include \r\nother blocks. Consider the importance of correct indentation \r\nto make code readable."
