elements:
- type: explanation
  location:
    snippet: int width = 10;
  explanations:
  - body: Declares a variable named 'width' and initializes(assigns) it with integer 10.
- type: explanation
  location:
    snippet: System.out.print(width);
  explanations:
  - body: 'The console output is: 10'
- type: explanation
  location:
    snippet: width = 20;
  explanations:
  - body: Changes width to 20 (assigns 20 to width).
- type: explanation
  location:
    snippet: System.out.println(width);
  explanations:
  - body: So far, the console output has two lines. The first line is 1020. After printing 20, the cursor moves to the new
      line (with empty string).
- type: explanation
  location:
    snippet: width = height + 10;
  explanations:
  - body: The right hand side of an assignment can be an expression. Now width is assigned 30.
- type: explanation
  location:
    snippet: System.out.println(width);
    nth: 2
  explanations:
  - body: The console output has three lines now. The first line is 1020, the second line is 30, and the third line is just
      empty string.
- type: explanation
  location:
    snippet: width = width + 10;
  explanations:
  - body: The same variable can occur on both sides of an assignment. In this case, the right side width represents the older
      value of width (30). We first conduct operations on the right side, and then assigns the result of 30+10 to the width
      on the left side. So the left side width represents the final value of width, which is 40.
