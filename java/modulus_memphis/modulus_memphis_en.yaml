id: we_modulus_memphis
source: HelloWorld.java
title: Modulus (Memphis)
description: |-
  Demonstrates usage of the % operator.  % means "remainder when you divide by"
  For example:
  49 % 6 = 1
  49 % 7 = 0
  8 % 2 = 0
  2 % 8 = 2
