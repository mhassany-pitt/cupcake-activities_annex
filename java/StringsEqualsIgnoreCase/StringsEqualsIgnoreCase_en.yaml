elements:
- type: explanation
  location:
    snippet: isEqual = str1.equals( str2 );
  explanations:
  - body: The equals() method evaluates if the two strings (str1 and str2) are equal. This comparison is case-sensitive. Here
      it returns 'false'.
- type: explanation
  location:
    snippet: System.out.println(isEqual);
  explanations:
  - body: Prints false.
- type: explanation
  location:
    snippet: isEqual = str1.equalsIgnoreCase( Str2 );
  explanations:
  - body: The equalsIgnoreCase() method evaluates if the two strings (str1 and str2) are equal without differentiating between
      upper and lower-case letters (the comparison is case-insensitive). Here it returns 'true'.
- type: explanation
  location:
    snippet: System.out.println(isEqual);
    nth: 2
  explanations:
  - body: Prints true.
