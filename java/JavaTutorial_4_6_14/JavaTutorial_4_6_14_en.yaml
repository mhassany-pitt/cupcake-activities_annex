elements:
- type: explanation
  location:
    snippet: for (int i = 1; i < 10; i += 2) {
  explanations:
  - body: "'i' starts with value 1, and for repeat until i=> 10. 'i' is incremented by 2 in each round. 'i' represents the\
      \ \r\namount of stars that we want to print in each line for the upper part of the star. To position the starts according\
      \ \r\nto the line to form the upper triangle, the next loop will print a number of spaces."
- type: explanation
  location:
    snippet: for (int j = 0; j < 9 - i / 2; j++)
  explanations:
  - body: "'j' starts with 0, and increments by 1 until j>=9-(i/2). Consider precedence of division. This for is nested and\
      \ \r\nthe value of 'i' will change. At the first time i=1, and i/2 is 0. Then the for prints 9 spaces. Next time, the\
      \ for \r\nwill print 8 spaces (i is 3, i/2 results in 1)."
- type: explanation
  location:
    snippet: for (int j = 0; j < i; j++)
  explanations:
  - body: This for prints many '*' as the current value of 'i'
- type: explanation
  location:
    snippet: for (int i = 7; i > 0; i -= 2) {
  explanations:
  - body: i will decrement by 2. This for loop (with the nested loops below) will print the lower part of the diamond
- type: explanation
  location:
    snippet: for (int j = 0; j < 9 - i / 2; j++)
    nth: 2
  explanations:
  - body: as i decrements, this for will print more spaces
- type: explanation
  location:
    snippet: for (int j = 0; j < i; j++)
    nth: 2
  explanations:
  - body: as i decrements, this for will print less asterisks (*)
