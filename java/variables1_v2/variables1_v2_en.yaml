elements:
- type: explanation
  location:
    snippet: int i;
  explanations:
  - body: A variable declaration statement always contains a data type, a variable name and a semicolon. This statement declares
      an integer variable 'i'.
- type: explanation
  location:
    snippet: String sentence;
  explanations:
  - body: "Type of the variable identifies the kind of data that can be stored in this variable. Type 'String' is used to\
      \ declare variables holding strings (text \r\nsequences)."
- type: explanation
  location:
    snippet: int a, b;
  explanations:
  - body: You can declare several variables of the same type in one statement. Variable names should be separated with a comma.
      This statement declares two integer variables 'a' and 'b'.
