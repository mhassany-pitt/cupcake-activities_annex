elements:
- type: explanation
  location:
    snippet: System.out.println(i1 == i2);
  explanations:
  - body: "the operator '==' tests whether the references refer to the same \r\nobject. Here, both i1 and i2 refer to the\
      \ same object, so 'true' is \r\nprinted"
- type: explanation
  location:
    snippet: System.out.println(i1 == i3);
  explanations:
  - body: Here, i1 and i3 refer to the different objects, so 'false' is printed
- type: explanation
  location:
    snippet: System.out.println(i1.equals(i3));
  explanations:
  - body: "the method 'equals()' tests whether the contents of the two objects is \r\nthe same. Here, 'true' is printed."
