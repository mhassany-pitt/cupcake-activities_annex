elements:
- type: explanation
  location:
    snippet: int[][] nums = new int[3][5];
  explanations:
  - body: "A multidimensional array of int is created (2 dimensions: 3 rows and 5 columns). nums[0] is \r\nthe first row.\
      \ nums[0][0] is the first \r\nelement of the first \r\nrow."
- type: explanation
  location:
    snippet: for (int i = 0; i < 3; i++)
  explanations:
  - body: 'This for has only one statement inside: another for. No braces {} are necessary.'
- type: explanation
  location:
    snippet: for (int j = 0; j < 5; j++)
  explanations:
  - body: This for has only one statement inside. No braces {} are necessary.
- type: explanation
  location:
    snippet: nums[i][j] = (i + 1) * (j + 1);
  explanations:
  - body: The array is filled with values row by row.
- type: explanation
  location:
    snippet: 'for (int x[] : nums) {'
  explanations:
  - body: "Another way to iterate inside the array. Now using for-each, each round take a complete row \r\nof the array \"\
      nums\" and references it \r\nas the array \"x\"."
- type: explanation
  location:
    snippet: 'for (int y : x) {'
  explanations:
  - body: Each round takes a value of the array "x" in the int variable "y".
- type: explanation
  location:
    snippet: sum += y;
  explanations:
  - body: The value of 'y' is added to the value of 'sum' and then the new value is stored in the sum.
