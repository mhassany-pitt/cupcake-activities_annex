    snippet: double getMeasure();
  explanations:
  - body: "/**      Computes the measure of the object.      @return the \r\nmeasure\r\n   */"
- type: explanation
  location:
    snippet: public class BankAccount implements Measurable {
  explanations:
  - body: /**   A bank account has a balance */
- type: explanation
  location:
    snippet: public BankAccount(double initialBalance){
  explanations:
  - body: "/**      Constructs a bank account with a given balance.\r\n      @param initialBalance the initial balance\r\n\
      \   */"
- type: explanation
  location:
    snippet: public class Coin implements Measurable
  explanations:
  - body: /**   A coin with a monetary value.*/
- type: explanation
  location:
    snippet: public Coin(double aValue, String aName)
  explanations:
  - body: "/**      Constructs a coin.      @param aValue the monetary \r\nvalue of \r\nthe coin\r\n      @param aName the\
      \ name of the coin\r\n   */"
- type: explanation
  location:
    snippet: Measurable meas;
  explanations:
  - body: "It is possible to define a variable of type interface. Here, any \r\nobject that implements \r\nthe Measurable\
      \ interface can be assigned to \r\n'meas'."
- type: explanation
  location:
    snippet: meas = new BankAccount(2000);
  explanations:
  - body: "Variable 'meas' is initialized with an instance of BankAccount with \r\n2000 balance."
- type: explanation
  location:
    snippet: System.out.println( meas.getMeasure());
  explanations:
  - body: calls getMeasure() in BankAccount, thus prints '2010'.
- type: explanation
  location:
    snippet: meas = new Coin(0.1,"dime");
  explanations:
  - body: "Variable 'meas' is initialized with an instance of Coin with 0.1 \r\nvalue. Again, since Coin \r\nimplements the\
      \ Measurable interface, it can \r\nbe directly assigned to 'meas' that has the \r\ntype 'Measurable'."
- type: explanation
  location:
    snippet: System.out.println( meas.getMeasure());
    nth: 2
