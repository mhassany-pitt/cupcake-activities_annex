  explanations:
  - body: "This Inner class is declared inside another class or inside a method within a class. When you have a class \r\n\
      that serves a very limited purpose, you can declare \r\nthe class as an inner class. In this case the class \r\n'Inner'\
      \ is declared inside the method that uses it. \r\nInner classes should not be visible elsewhere in a \r\nprogram."
