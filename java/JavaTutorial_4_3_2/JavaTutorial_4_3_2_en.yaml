  - body: switch evaluates the value of a variable
- type: explanation
  location:
    snippet: 'case 1:'
  explanations:
  - body: 'Each possible value we want to consider is defined in a case clause. This can be read as: "In the case that the
      value of choice is 1, do..."'
- type: explanation
  location:
    snippet: break;
  explanations:
  - body: "Each case clause should finish with a \"break\" statement. Otherwise, the next case will be executed even if the\
      \ value of \"choice\" does not met the condition. In this way, several \"cases\" can be concatenated to \r\nexecute\
      \ the same block if any of the conditions is met."
- type: explanation
  location:
    snippet: 'default:'
  explanations:
  - body: The default clause is executed if none of the cases match.
