statement: Construct a program that calculates the average speed in miles per hour using the values stored in variables given
  and print the height in meters with 2 digits after the decimal point to the console.
elements:
- type: explanation
  location:
    snippet: final double MILES_PER_MARATHON = 26.21875;
  explanations:
  - body: The variable MILES_PER_MARATHON is declared as double type and initialized to 26.21875. final modifier is used to
      make MILES_PER_MARATHON a constant variable, immutable. Constant variables are assigned to a value exactly once and
      this value cannot be changed after the initialization. The constant variables have to be initialized to a value when
      they declared. By Java naming conventions for constants, upper case letters are used and words are separated with '_'.
- type: explanation
  location:
    snippet: final int SEC_PER_HR = 3600;
  explanations:
  - body: The variable SEC_PER_HR is declared as int type and initialized to 3600. final modifier is used to make SEC_PER_HR
      a constant variable, immutable. Constant variables are assigned to a value exactly once and this value cannot be changed
      after the initialization. The constant variables have to be initialized to a value when they declared. By Java naming
      conventions for constants, upper case letters are used and words are separated with '_'.
- type: explanation
  location:
    snippet: final int SEC_PER_MIN = 60;
  explanations:
  - body: The variable SEC_PER_MIN is declared as int type and initialized to 60. final modifier is used to make SEC_PER_MIN
      a constant variable, immutable. Constant variables are assigned to a value exactly once and this value cannot be changed
      after the initialization. The constant variables have to be initialized to a value when they declared. By Java naming
      conventions for constants, upper case letters are used and words are separated with '_'.
- type: explanation
  location:
    snippet: double totalSecs = runtimeHrs*SEC_PER_HR + runtimeMins*SEC_PER_MIN + runtimeSecs;
  explanations:
  - body: The values of MILES_PER_MARATHON,SEC_PER_MIN,SEC_PER_HR constant are accessed and used in multiplication, division
      and addition arithmetic operations.
- type: explanation
  location:
    snippet: 'System.out.format("Average MPH was: %.2f mph\n", aveMPH);'
  explanations:
  - body: The System.out.format method is used to print formatted output to the console. Format specifiers are defined using
      %. Here, %.2f means that %.2f should be replaced with the aveMPH value and exactly 2 digits should be printed after
      the decimal(.). The number comes after the '.' defines the number of digits printed after the decimal and f defines
      that the heightInMeters is a double or a float number.
