statement: Constants
elements:
- type: explanation
  location:
    snippet: final int FEET_PER_YARD = 3;
  explanations:
  - body: Using the final keyword to declare a variable. The final keyword specifies that the value of a variable is final
      and cannot be changed. By convention, we use all-uppercase for constants.  Here, FEET_PER_YARD is declared as a constant
      integer, 3.
- type: explanation
  location:
    snippet: final double MM_PER_INCH = 25.4;
  explanations:
  - body: MM_PER_INCH is declared as a constant double, 25.4.
- type: explanation
  location:
    snippet: System.out.println(FEET_PER_YARD);
  explanations:
  - body: Prints 3.
- type: explanation
  location:
    snippet: System.out.println(MM_PER_INCH);
  explanations:
  - body: Prints 25.4.
