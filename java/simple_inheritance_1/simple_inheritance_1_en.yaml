elements:
- type: explanation
  location:
    snippet: public class Pet {
  explanations:
  - body: "The class Pet has some code implementing 3 methods: speak(), \r\njump() and walk()"
- type: explanation
  location:
    snippet: public class Dog extends Pet {
  explanations:
  - body: "The class Dog extends Pet. This means it inherits all code implemented in class Pet. In general, \"Inheritance\"\
      \ happens when ClassB extends ClassA, then ClassA is called \"superclass\" and ClassB is called \"subclass\". In this\
      \ example, \nPet is the superclass and Dog is the subclass."
- type: explanation
  location:
    snippet: Dog myDog = new Dog();
  explanations:
  - body: An object of class Dog is created.
- type: explanation
  location:
    snippet: myDog.speak();
  explanations:
  - body: "Even when Dog class has no methods by its own, it inherits the \r\nmethods of the superclass Pet. This line prints\
      \ \"speaking!\""
- type: explanation
  location:
    snippet: myDog.walk();
  explanations:
  - body: Method walk() is inherited from class Pet. This line prints "walking!"
- type: explanation
  location:
    snippet: myDog.jump();
  explanations:
  - body: "Method jump() is inherited from class Pet. This line prints \r\n\"jumping!\""
