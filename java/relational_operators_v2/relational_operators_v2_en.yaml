elements:
- type: explanation
  location:
    snippet: boolean flag;
  explanations:
  - body: "boolean type is used to store boolean values. Variable 'flag' can have only one \r\nof two values: true or false."
- type: explanation
  location:
    snippet: flag = 5 < 6;
  explanations:
  - body: "In this case, the right side of the assignment sign '=' is a relational \r\nexpression. The result of the relational\
      \ expression has a boolean type and \r\ncan be stored in a \r\nboolean variable. In this case the result of '5 < 6'\
      \ is \r\ntrue, hence 'flag' becomes 'true'."
- type: explanation
  location:
    snippet: flag = (i == j);
  explanations:
  - body: flag becomes false, since 3 is not equal to 4
