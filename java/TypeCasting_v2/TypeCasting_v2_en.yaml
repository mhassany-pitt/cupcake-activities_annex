statement: Type Casting
elements:
- type: explanation
  location:
    snippet: float f = (float) d;
  explanations:
  - body: A double value cannot be directly assigned to a float variable. Type casting is required to do so. Type Casting
      refers to changing an entity of one datatype into another. Here, we change a double datatype to float.
- type: explanation
  location:
    snippet: int i = (int) d;
  explanations:
  - body: To assign a double or float value to a variable of an integer type you need to typecast this value. This will truncate
      the floating part of the double value.
- type: explanation
  location:
    snippet: byte b = (byte) i;
  explanations:
  - body: To convert from a longer integer type to a shorter integer type a typecasting is required. As in all cases above,
      some information can be lost. For example, here if the value of variable i is not between -128 and 127, the resulting
      value of variable b will be different from the expected.
