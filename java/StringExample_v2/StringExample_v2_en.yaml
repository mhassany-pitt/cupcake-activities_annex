elements:
- type: explanation
  location:
    snippet: String s = null;
  explanations:
  - body: "A string literal is a series of \r\ncharacters in your code that is \r\nenclosed in double quotes. Whenever \r\n\
      it encounters a string literal in your \r\ncode, the compiler \r\ncreates a String object with its value. \r\nIn this\
      \ case, the \r\nliteral null is an object reference \r\nvalue that does not \r\nrefer to anything."
- type: explanation
  location:
    snippet: String s1 = "1" +"+"+ "2";
  explanations:
  - body: "You can compose long string literals \r\nby using the plus sign to concatenate \r\nstring literals.  Here, s1 is\
      \ '1+2'"
- type: explanation
  location:
    snippet: String s2 = s1 + "=3";
  explanations:
  - body: s2 is '1+2=3'
- type: explanation
  location:
    snippet: System.out.println(s);
  explanations:
  - body: Prints 'null'.
- type: explanation
  location:
    snippet: System.out.println(s1);
  explanations:
  - body: Prints '1+2'.
- type: explanation
  location:
    snippet: System.out.println(s2);
  explanations:
  - body: Prints '1+2=3'.
