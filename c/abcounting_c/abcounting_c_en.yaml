elements:
- type: explanation
  location:
    snippet: int ch;
  explanations:
  - body: variable ch will be used to read characters from the standard input. It is defined as int since it should be able
      to get the EOF value that is not char
- type: explanation
  location:
    snippet: int a = 0, b = 0, c = 0;
  explanations:
  - body: 'initializing the counters. We could also do it shorter: a = b = c = 0;'
- type: explanation
  location:
    snippet: while ((ch = getchar()) != EOF)
  explanations:
  - body: When the condition of this while loop is executed, a new character is read from the standard input and assigned
      to ch. If it is EOF, the loop is over
- type: explanation
  location:
    snippet: if (ch == 'a' || ch == 'A')
  explanations:
  - body: if the character read is capital or lower case A...
- type: explanation
  location:
    snippet: a++;
  explanations:
  - body: this line increments the counter of a
- type: explanation
  location:
    snippet: else if (ch == 'b' || ch == 'B')
  explanations:
  - body: otherwise, if the character read is capital or lower case B...
- type: explanation
  location:
    snippet: b++;
  explanations:
  - body: this line increments the counter of b
- type: explanation
  location:
    snippet: else if (ch == 'c' || ch == 'C')
  explanations:
  - body: otherwise, if the character read is capital or lower case B...
- type: explanation
  location:
    snippet: c++;
  explanations:
  - body: this line increments the counter of c
