elements:
- type: explanation
  location:
    snippet: You are admitted only if your general and IS QPAs
  explanations:
  - body: This and the following line explain the logics of the program. It is important for a reader to understand what is
      going on
- type: explanation
  location:
    snippet: '#define MINQPA 2.5'
  explanations:
  - body: This constant defines general QPA threshold
- type: explanation
  location:
    snippet: '#define MINISQPA 2.75'
  explanations:
  - body: This constant defines IS QPA threshold
- type: explanation
  location:
    snippet: scanf("%f", &qpa1);
  explanations:
  - body: The general QPA is read as a floating point number and assigned to variable qpa1
- type: explanation
  location:
    snippet: scanf("%f", &qpa2);
  explanations:
  - body: The IS QPA is read as a floating point number and assigned to variable qpa1
- type: explanation
  location:
    snippet: if (qpa1 >= MINQPA && qpa2 >= MINISQPA)
  explanations:
  - body: 'This complex condition will be true (i.e., 1) if at both of the components are true: qpa1 >= MINQPA and qpa2 >=
      MINISQPA'
- type: explanation
  location:
    snippet: |-
      printf("You are admitted to BSIS program!
      ");
  explanations:
  - body: In that case "then" part is executed and the report about admission is printed
- type: explanation
  location:
    snippet: else /* here either qpa1 < MINQPA or qpa2 < MINISQPA or both */
  explanations:
  - body: Else part will be executed if the condition is false. And condition will is false if at least one of its component
      is false - i.e., either if at least one of the components is true -  ether qpa1 < MINQPA or qpa2 < MINISQPA or both
- type: explanation
  location:
    snippet: |-
      printf("Your QPA is too low for BSIS
      ");
  explanations:
  - body: In that case "else" part is executed reporting low QPA
