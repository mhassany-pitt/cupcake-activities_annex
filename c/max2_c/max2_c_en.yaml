elements:
- type: explanation
  location:
    snippet: 'printf("Enter two integers: ");'
  explanations:
  - body: This is a prompt
- type: explanation
  location:
    snippet: scanf("%d %d", &a, &b);
  explanations:
  - body: This scanf statement gets two integers separated by a blank from the user and placed them into variables a and b.
- type: explanation
  location:
    snippet: printf("Maximum of %d and %d ", a, b);
  explanations:
  - body: This statement prints the first part of the message. At that time it is not clear which of the two values is a maximum
- type: explanation
  location:
    snippet: if(a < b)
  explanations:
  - body: This if conditional statement has expression a < b in its condition. If a is really less than b, the value of the
      expression will be 1 and "then" part will be executed. Otherwise, the value will be 0 and "else" part will work
- type: explanation
  location:
    snippet: |-
      printf("is %d
      ", b);
  explanations:
  - body: This "then" statement will be executed if a is less than b and thus the condition value is 1. That means that b
      is the largest of the two numbers
- type: explanation
  location:
    snippet: |-
      printf("is %d
      ", a);
  explanations:
  - body: This "else" statement will be executed if a is greater of equal b and thus the condition value is 0. That means
      that a is the maximum of the two numbers
