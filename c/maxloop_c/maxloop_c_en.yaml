elements:
- type: explanation
  location:
    snippet: Reads numbers until -1 is entered. Prints the max number entered.
  explanations:
  - body: The semantic interpretation of this program is funding out the size of the largest group coming to the party.
- type: explanation
  location:
    snippet: '#define SENTINEL -1'
  explanations:
  - body: This time we will use -1 as a signal to stor calculation. Since a group of -1 people can't come to a party, it is
      a good sentinel value.
- type: explanation
  location:
    snippet: int max, nextnumber;
  explanations:
  - body: variable max will be used to store the "running"" max value - i.e., the max of the values read so far.
- type: explanation
  location:
    snippet: scanf("%d", &nextnumber); /* read first number */
  explanations:
  - body: This is the usual pre-reading statement
- type: explanation
  location:
    snippet: max = nextnumber; /* pre-assignment */
  explanations:
  - body: Since we have so far only one number read, it is also the max of all read numbers
- type: explanation
  location:
    snippet: while (nextnumber != SENTINEL) {
  explanations:
  - body: This is a sentinel reading loop. It will work until nexnumber (value read from he user) become equal to sentinel
      - here -1
- type: explanation
  location:
    snippet: if (max <  nextnumber)
  explanations:
  - body: If the newly read number is greater that thhe current max, then it is the new current maximum and we need to store
      it in variable max
- type: explanation
  location:
    snippet: max = nextnumber;
  explanations:
  - body: This line re-assigns max to the new maximum value if the condition above is true.
- type: explanation
  location:
    snippet: scanf("%d", &nextnumber);
  explanations:
  - body: This line reads new value from the user. It is a part of sentinel reading pattern
- type: explanation
  location:
    snippet: |-
      printf ("Max = %d
      ", max);
  explanations:
  - body: After the sentinel value is read and the loop stopped, the variable max stores the maximum of all read values. So,
      it is printed.
