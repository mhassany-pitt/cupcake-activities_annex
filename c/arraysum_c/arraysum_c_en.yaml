- type: explanation
  location:
    snippet: '#define N 7 /* dimension of the array */'
  explanations:
  - body: Dimension of the array.  The define statement sets up a meaningful, symbolic constant value that is used consistently
      throughout the program.  For example, wherever N is used, the value 7 will replace it.   Very useful if the value of
      N needs to be change
- type: explanation
