  explanations:
  - body: An array of 7 integer values is defined.  Because array positions begin from 0, elements of this array has indexes
      from 0 to 6.
- type: explanation
  location:
    snippet: int i, sum;
  explanations:
  - body: i and sum are both declared as integers.  sum is an  integer because it will hold the sum of elements in an integer
      array ar. i is an integer since it is a counter variable.  A counter variable counts the number of loop iterations.
