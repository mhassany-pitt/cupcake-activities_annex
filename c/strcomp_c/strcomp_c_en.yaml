elements:
- type: explanation
  location:
    snippet: 'Example 14.2: string comparison with pointers'
  explanations:
  - body: Comments not done.
- type: explanation
  location:
    snippet: '#define MAXLEN 100'
  explanations:
  - body: 'Define the maximum length to be 100.  This is used to limit the length of strings being compared.  As usual, by
      putting it in a #define statement, many lines of code (where MAXLEN is used) can be changed at one time.'
- type: explanation
  location:
    snippet: int getline(char *s, int lim)
  explanations:
  - body: Getline function is defined here.  It takes a pointer and an integer (maximum line length) as its parameters and
      gives back a line length
- type: explanation
  location:
    snippet: |-
      for (i = 0; i < lim-1 &&(c=getchar())!= EOF && c != '
      '; ++i)
  explanations:
  - body: This For loop will continue as long as it has not reached the maximum length of a string allowed and there are no
      more characters and it isn't the end of a line.
