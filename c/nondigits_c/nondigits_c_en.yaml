  location:
    snippet: '/* Example: Counting non-digits in the stream of text */'
  explanations:
  - body: This is the header comment. It explains what the program is doing.
- type: explanation
  location:
    snippet: int ch;
  explanations:
  - body: Variable ch will be used to read characters from the standard input. It is defined as int since it should be able
      to get the EOF value that is not char
- type: explanation
  location:
    snippet: while ((ch = getchar()) != EOF)
  explanations:
  - body: When the condition of this while loop is evaluated, a new character is read from the standard input and assigned
      to ch. If getchar() returns EOF, the loop is over
