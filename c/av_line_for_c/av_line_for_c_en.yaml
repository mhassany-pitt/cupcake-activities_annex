elements:
- type: explanation
  location:
    snippet: int c, nl;
  explanations:
  - body: Variable c has to be defined as an integer since it may get EOF value as a result if the assignment below. EOF (usually,
      -1)  is not a char value.
- type: explanation
  location:
    snippet: long nc;
  explanations:
  - body: Variable nc is defined as long to enable us to count symbols in large files.
- type: explanation
  location:
    snippet: for (nc = 0; (c = getchar()) != EOF; ++nc)
  explanations:
  - body: As an initialization of this for loop, variable nc is aassigned to 0. The loop condition is (c = getchar()) != EOF
      - same as in while version of this program. The iterative step is ++nc and it increments the value of nc every iteration
      as the last action
- type: explanation
  location:
    snippet: ++nl;
  explanations:
  - body: This line will be executed only when c is the newline symbol - i.e., once for every new line.
- type: explanation
  location:
    snippet: if(nl)
  explanations:
  - body: If nl is still 0 (i.e., there were no lines of input) we will not execute the following statement and will avoid
      a "division by zero" error.
- type: explanation
  location:
    snippet: |-
      printf("Average line length is %.2f
      ", nc / (float) nl);
  explanations:
  - body: Since both nc and nl are integral type variables, we need to use expplicit casting to avoid integer division. We
      want a floating point result that will give us a more precise value for the average line lengh.
