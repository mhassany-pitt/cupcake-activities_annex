- type: explanation
  location:
    snippet: '#define MINQPA 2.5'
  explanations:
  - body: This constant defines general QPA threshold
- type: explanation
  location:
    snippet: '#define MINISQPA 2.75'
  explanations:
  - body: This constant defines IS QPA threshold
- type: explanation
  location:
    snippet: 'printf("Your general QPA?: ");'
  explanations:
  - body: Prompt to enter general QPA
- type: explanation
  location:
    snippet: scanf("%f", &qpa1);
  explanations:
  - body: The general QPA is read as a floating point number and assigned to variable qpa1
- type: explanation
  location:
    snippet: 'printf("Your IS QPA?: ");'
  explanations:
  - body: Prompt to enter IS QPA
- type: explanation
  location:
    snippet: scanf("%f", &qpa2);
  explanations:
  - body: The IS QPA is read as a floating point number and assigned to variable qpa1
- type: explanation
  location:
    snippet: if (qpa1 < MINQPA || qpa2 < MINISQPA)
  explanations:
  - body: This complex condition will be true (i.e., 1) if at least one of the components is true -  ether qpa1 < MINQPA or
      qpa2 < MINISQPA or both
- type: explanation
  location:
    snippet: |-
      printf("Your QPA is too low for BSIS
      ");
  explanations:
  - body: If the complex condition is true (1) this "then" part is executed reporting low QPA
- type: explanation
  location:
    snippet: else
  explanations:
  - body: Else part will be executed if the condition is false, in that case it means that qpa1 >= MINQPA and qpa2 >= MINISQPA
- type: explanation
  location:
    snippet: |-
      printf("You are admitted to BSIS program!
      ");
  explanations:
  - body: In that case, the report about admission is printed
