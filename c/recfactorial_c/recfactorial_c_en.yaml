    snippet: |-
      printf("%d! = %d
      ", i, factorial(i));
  explanations:
  - body: The job of calculating the factorial is delegated to finction <i>factorial</i>. Now printing the value of vactorial
      is easy - we simply call this function with the proper parameter.
