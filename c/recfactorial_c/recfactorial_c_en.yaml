- type: explanation
  location:
    snippet: int factorial(int n) {
  explanations:
  - body: This function calculates and returns the factorial for the integer number given as its parameter. Note that it has
      no local variables.
- type: explanation
  location:
    snippet: if(n == 0)
  explanations:
  - body: This condition let us choose between a base case and a recursive case.
- type: explanation
  location:
    snippet: return 1;
  explanations:
  - body: This is the base case that solves the problem in one step with no recursive calls. Indeed, factorial(0) is 1 by
      definition. We do not need any recursive calls and simplt return 1.
- type: explanation
  location:
    snippet: return (n * factorial(n-1));
