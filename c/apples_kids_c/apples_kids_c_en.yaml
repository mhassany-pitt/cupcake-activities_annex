  - body: This scanf operator places the number of kids entered by the user into variable kids
- type: explanation
  location:
    snippet: do {
  explanations:
  - body: This is the start of the do-while loop. There is no condition here, it is at the end of the loop. We will proceed
      with the first statement of the loop unconditionally
- type: explanation
  location:
    snippet: apples -= kids;
  explanations:
  - body: This line simulates distribution of kids apples among kids. We have kids apples less (kids is subtracted from apples)
      and each kid will get one more apple
- type: explanation
  location:
    snippet: rounds++;
  explanations:
  - body: The counter of rounds is incremented. It also counts how many apples each kid has got (since each kid gets one apple
      each round
- type: explanation
  location:
    snippet: |-
      printf("%d apples left after round %d
      ", apples, rounds);
  explanations:
  - body: This line is useful to observe the process of apple distribution. It prints the number of apples left after each
      round
- type: explanation
  location:
    snippet: '} while (apples >= kids) ;'
  explanations:
  - body: This is the end of the do-while loop, the place for its condition. If the current value of variable apples is greater
      or equal than the current value of kids (i.e., we still have aples to distribute), we go back to execute the loop body.
      Otherwise (not en
- type: explanation
  location:
    snippet: |-
      printf ("Each kid got %d apples. %d apples left.
      ", rounds, apples);
  explanations:
  - body: This is the first statement after the loop. It reports the results of our work - how many apples each kid got (this
      is the integer division) and how many are left (this is the remainder)
