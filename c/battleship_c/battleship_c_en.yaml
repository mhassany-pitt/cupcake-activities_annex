    snippet: row = r - 'A';
  explanations:
  - body: By subtracting 'A' from the decimal value of the char ch_row, the results for  A to E will be int row 0 to 4.
- type: explanation
  location:
    snippet: if(row < 0 || row > 4)
  explanations:
  - body: Nothing else but A to E ( 0 to 4 above) will be accepted.
- type: explanation
  location:
    snippet: |-
      printf("Row %c is not possible!
      ", r);
  explanations:
  - body: The wrong value is printed out.
- type: explanation
  location:
    snippet: else if (col <1 || col >5)
  explanations:
  - body: Only columns 1 to 5 will be accepted.  This is more straightforward.
- type: explanation
  location:
    snippet: else if (battlefield[row][col-1] == SHIP) {
  explanations:
  - body: If a ship is in that position, a hit will be scored.
- type: explanation
  location:
    snippet: battlefield[row][col-1] = DESTROYED;
  explanations:
  - body: If hit, the value changes to DESTROYED, which is 2.
- type: explanation
  location:
    snippet: '} else if (battlefield[row][col-1] == DESTROYED)'
  explanations:
  - body: If  it's already been destroyed (value 2), only a message is printed, and nothing is changed.
- type: explanation
  location:
    snippet: |-
      printf("Miss...
      ");
  explanations:
  - body: If not 1 or 2, it's a miss. (SHIP 1, DESTROYED 2)
