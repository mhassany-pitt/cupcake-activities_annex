elements:
- type: explanation
  location:
    snippet: int counter = 5; /* setting the counter */
  explanations:
  - body: This variable will be used as a loop counter. It is declared as integer and initialized to 5
- type: explanation
  location:
    snippet: |-
      printf("Start counting...
      ");
  explanations:
  - body: The line Start counting will be printed before the loop
- type: explanation
  location:
    snippet: while (counter) {
  explanations:
  - body: At each iteration of the loop, the current value of the counter is checked. If this value is zero (0), the loop
      will will be skipped, otherwise execution will proceed with the first statement inside the loop.
- type: explanation
  location:
    snippet: |-
      printf("%d
      " , counter);
  explanations:
  - body: This statement simply prints the current value of counter.
- type: explanation
  location:
    snippet: counter = counter - 1;
  explanations:
  - body: The goal of this statement is to subtract 1 from the current value of the counter. I.e., the value of counter will
      be "one less".
- type: explanation
  location:
    snippet: '}'
  explanations:
  - body: This is the end of the block braces. We need to use block here since while statement can have only one C statement
      inside its body. We have two and so we need to wrap them as a block.
- type: explanation
  location:
    snippet: |-
      printf("Fire!
      ");
  explanations:
  - body: This is the first statement after the loop. Here the execusion will resume when checking the expression controlling
      the loop (counter) we will find that it became zero
