    snippet: int marks; float dollars;
  explanations:
  - body: It is possible to define several variables of different type in one line, but it is an example of a bad style that
      decreases the program readability. Note that variables marks and dollars has not been iniialized. Their values are not
      defined at that point
- type: explanation
  location:
    snippet: 'printf("Marks to exchange?: ");'
  explanations:
  - body: |-
      This is a prompt string for the input. Note that there is no '
      ' - the cursor will not go to the next line and the variable input will happen in this line.
- type: explanation
  location:
    snippet: scanf("%d",&marks);
  explanations:
  - body: This scanf command reads an integer value from the standard input and places it into variable marks.
- type: explanation
  location:
    snippet: dollars = marks * dollars_for_mark - commission;
  explanations:
  - body: Blanks that separate operation sign (like = or *) from operands make the expression more redable
