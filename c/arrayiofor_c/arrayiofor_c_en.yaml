elements:
- type: explanation
  location:
    snippet: '#include <stdio.h>'
  explanations:
  - body: This is a preprocessor command. System header file stdio.h will be   inserted there during compilation.  We include
      stdio.h header file because it contains function prototypes for printf
- type: explanation
  location:
    snippet: '#define DIM 5 /* dimension of the array */'
  explanations:
  - body: The define statement sets up a meaningful, symbolic constant for the size (dimemsion) of the array that is used
      consistently throughout the program.  In this case, wherever N is used, the value 7 will replace it literally.   Defining
      constants is useful
- type: explanation
  location:
    snippet: int ar[DIM]; /* elements from ar[0] to ar[DIM-1]; */
  explanations:
  - body: An array of 5 integer values is defined.  Elements of this array have indexes from 0 to 4.
- type: explanation
  location:
    snippet: for (i = 0; i < DIM; ++i) {
  explanations:
  - body: This is a typical for-loop for processing arrays. It starts with initializing loop counter to 0. The condition makes
      sure that we will stop after processing the last (DIM-1) element. Last iteration of this loop happens with when i has
      value DIM - 1 - i.e.
- type: explanation
  location:
    snippet: 'printf("Element %d: ", i);'
  explanations:
  - body: This prints a prompt for entering the value for the next element of the array
- type: explanation
  location:
    snippet: scanf("%d", &ar[i]);
  explanations:
  - body: This line shows that a value can be "scanned" inside an element of an array the same way as we can scan in into
      a regular variable.
- type: explanation
  location:
    snippet: for (i = 0; i < DIM; ++i)
  explanations:
  - body: This is a typical for-loop for processing arrays. It starts with initializing loop counter to 0. The condition makes
      sure that we will stop after processing the last (DIM-1) element. Last iteration of this loop happens with when i has
      value DIM - 1 - i.e.
- type: explanation
  location:
    snippet: printf("%d ", ar[i]);
  explanations:
  - body: This line prints the value of array element with index i. Since i will take different values at different iterations
      of this loop running from 0 to 4, all values will be printed one by one
- type: explanation
  location:
    snippet: for (i = DIM-1; i >= 0; --i)
  explanations:
  - body: This is a typical for-loop for processing an array from the end to the beginning (in reverse order) It starts with
      initializing loop counter to DIM-1 making it point to the last element of the array. The condition makes sure that we
      will stop after proces
- type: explanation
  location:
    snippet: printf("%d ", ar[i]);
    nth: 2
  explanations:
  - body: This line prints the value of array element with index i. Since i will take different values at different iterations
      of this loop running from 4 to 0, all values will be printed one by one
