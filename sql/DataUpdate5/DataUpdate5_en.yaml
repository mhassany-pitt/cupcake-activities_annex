statement: Updating with subquery
elements:
- type: explanation
  location:
    snippet: SET credit_limit = credit_limit + 5000.00
  explanations:
  - body: Before executing update, subquery in parenthesis is executed to limit the data. After then, this addition of $5,000
      to current credit limit is updated.
- type: explanation
  location:
    snippet: WHERE cust_num IN
  explanations:
  - body: WHERE clause choose one of the customers in the results of subquery. IN is the common search condition. It tests
      whether a data value matches one of the list of value in the right part. It compares instances in 'cust_num' to the
      results of subquery.
- type: explanation
  location:
    snippet: (SELECT DISTINCT cust
  explanations:
  - body: This SELECT query is subquery, a query within a query. This query is to retrieve the list of customers who bought
      product in amout of 25000. When choose some data collectively, it is efficient to use subquery.  Subquery let users
      select rows to update based on information contains in other tables.
