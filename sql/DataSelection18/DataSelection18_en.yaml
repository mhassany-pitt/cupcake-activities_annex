elements:
- type: explanation
  location:
    snippet: SELECT DISTINCT customer_name
  explanations:
  - body: DISTINCT is to eliminated the same row of results. So the customer having loan will be displayed alphabetically
      without duplication.
- type: explanation
  location:
    snippet: FROM borrower AS T, loan AS S
  explanations:
  - body: Table aliases are defined for both borrower and loan table. The table alias can be used if the table name is too
      long to write the whole name or for the convenience of query programmer
- type: explanation
  location:
    snippet: WHERE T.loan_no = S.loan_no
  explanations:
  - body: Loan number in borrower table is matched with loan number in loan table.
- type: explanation
  location:
    snippet: ORDER BY customer_name;
  explanations:
  - body: By using ORDER BY clause, you can define column that you want to list in order.  DESC clause specifies descending
      order and ASC specifies ascending order and these DESC or ASC is placed right next to the column name; ascending order
      is the default.
