elements:
- type: explanation
  location:
    snippet: WHERE amount IS NULL;
  explanations:
  - body: IS NULL predicate is to handle null value directly as a comparison. If the compared value is null, it results TRUE
      and vice versa. NULL is just a keyword that the value is unknown. Even if the comparison test 'amount = null' were legal,
      the rules can be different from what you might expect. It is because this comparison is like this, 'Known Value = Unknown
      Value'. Hence, it is impossible to judge whether it is TRUE or FALSE.
