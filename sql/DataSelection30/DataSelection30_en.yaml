statement: Comparing Subquery Results (1)
elements:
- type: explanation
  location:
    snippet: WHERE assets > SOME
  explanations:
  - body: The SOME test is used in conjunction with one of the six SQL comparison operators (=, <>, <, <=, >, >=) to compare
      the test value with the results of subquery. If any of the individual comparisons yield a TRUE result, the SOME test
      results a TRUE results. SOME and ANY are equivalent. In this example, asset of every branch is compared with every assets
      of branch in 'Brooklyn'.
- type: explanation
  location:
    snippet: (SELECT assets
  explanations:
  - body: This is to find assets of branch opened in 'Brooklyn'.
