- type: explanation
  location:
    snippet: INSERT INTO Students(sid, name, age)
  explanations:
  - body: O aluno 'Jamie Done' que tem 22 anos de idade e numero de matricula '2007001' e' inserido na tabela 'Students'.
- type: explanation
  location:
    snippet: VALUES('2007001', 'Jamie Done', 22);
  explanations:
  - body: A clausula VALUES define os valores a serem inseridos. A ordem dos valores deve corresponder a ordem das colunas
      da linha anterior. Se a coluna for do tipo caractere, o valor deve ser estar entre aspas. Nesse exemplo, as colunas
      'sid' e 'name' sao do tipo caractere, entao os valores estao entre aspas.
