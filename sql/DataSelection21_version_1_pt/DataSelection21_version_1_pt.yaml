- type: explanation
  location:
    snippet: EXCEPT
  explanations:
  - body: O operador EXCEPT produz um unica tabela contendo as tuplas que aparecem no resultado da primeira consulta mas nao
      aparecem no resultado da segunda consulta. Note que o resultado das duas consultas devem possuir o mesmo numero de colunas
      e com os mesmos tipos de dados. <u>Por padrao</u>, o operador EXCEPT elimina as linhas duplicadas. Caso queira manter
      as linhas duplicadas, deve-se utilizar a palavra-chave ALL depois da palavra EXCEPT, como 'EXCEPT ALL'.
