elements:
- type: explanation
  location:
    snippet: |-
      FROM Customers
      LEFT JOIN Orders ON Customers.CustomerID = Orders.CustomerID
  explanations:
  - body: The LEFT JOIN keyword returns all records from the left table (Customers), even if there are no matches in the right
      table (Orders). This returns the list of all customers' orders. However, in contrast to INNER JOIN, which will not show
      customers without orders, LEFT JOIN will show those customers and NULL in their orders-related columns.
