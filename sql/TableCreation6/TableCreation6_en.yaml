elements:
- type: explanation
  location:
    snippet: CREATE TABLE Sailors
  explanations:
  - body: This example is to define 'Sailors' table. There are four columns - sid, sname, rating, and age.
- type: explanation
  location:
    snippet: CHECK (rating >= 1 AND rating <= 10));
  explanations:
  - body: Especially, the value of 'rating' is restricted to the value from 1 to 10. When a check constraint is specified
      for a column the DBMS authomatically checks the value of that column each time a new row is inserted or a row is updated
      to ensure that the search condition is true.
