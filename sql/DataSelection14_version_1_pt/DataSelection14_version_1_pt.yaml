elements:
- type: explanation
  location:
    snippet: WHERE amount BETWEEN 2000 AND 100000;
  explanations:
  - body: A clausula BETWEEN e' um operador de intervalo. O teste de intervalo verifica se o valor da coluna esta entre dois
      valores especificados. A parte da esquerda da palavra-chave AND representa o limite inferior do intervalo e a parte
      da direita representa o limite superior do intervalo. Essa clausula e' equivalente 'a (amount >= 2000) AND (amount <=100000).
