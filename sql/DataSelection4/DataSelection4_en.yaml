- type: explanation
  location:
    snippet: SELECT DISTINCT name
  explanations:
  - body: DISTINCT keyword eliminates rows of query results in SELECT statement and is located before the column name to erase
      the duplicate. If the DISTINCT keyword is omitted, SQL does not eliminate duplicate and it has the same result when
      user use ALL  keyword instead of DISTINCT.
