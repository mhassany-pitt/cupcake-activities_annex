- type: explanation
  location:
    snippet: WHERE assets > ALL
  explanations:
  - body: O teste utilizando ALL e' usado em conjunto com um dos seis operadores SQL de comparacao (=, <>, <, <=, >, >=) para
      comparar o valor de teste com os resultados da subconsulta. Se todas as comparacoes individuais leva a um resultado
      VERDADEIRO, o teste ALL retorna um valor VERDADEIRO. Nesse exemplo, o ativo de cada agencia e' comparado com todos os
      ativos das agencias do 'Brooklyn' e se TODOS os valores das agencias do 'Brooklyn' forem menores que o ativo da agencia
      comparada, a tupla e' retornada como resultado.
