statement: Primary Key and Unique Key
elements:
- type: explanation
  location:
    snippet: CREATE TABLE Enrolled
  explanations:
  - body: Students can take a single course only once, not more than once.
- type: explanation
  location:
    snippet: (eid CHAR(20) NOT NULL,
  explanations:
  - body: This column is for enrollment ID and it is defined as primary key. Hence, the value should be unique among rows
      of the table
- type: explanation
  location:
    snippet: sid CHAR(20),
  explanations:
  - body: This column is for student ID and it is defined as a part of candidate key which is defined in UNIQUE clause.
- type: explanation
  location:
    snippet: cid CHAR(20),
  explanations:
  - body: This course ID is also another part of candidate key which is defined in UNIQUE clause.
- type: explanation
  location:
    snippet: PRIMARY KEY (eid),
  explanations:
  - body: If there is more than one same eids, there is integrity error.
- type: explanation
  location:
    snippet: UNIQUE (sid, cid));
  explanations:
  - body: UNIQUE keyword is to specify an unique value in every row, but not the primary key of a table. The unique values
      which can be primary key is called as candidate key. In this example, the pair of cid and sid should be unique. A student
      whose sid is 1324 can enroll in 'DB Management' course once but not more than once. Howver, the student can take other
      classes having differnt cids. It is possible to define the UNIQUE key as an attribute constraint.
