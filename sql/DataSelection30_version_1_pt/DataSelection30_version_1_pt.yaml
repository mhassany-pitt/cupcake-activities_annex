- type: explanation
  location:
    snippet: WHERE assets > SOME
  explanations:
  - body: O teste utilizando SOME e' usado em conjunto com um dos seis operadores SQL de comparacao (=, <>, <, <=, >, >=)
      para comparar o valor de teste com os resultados da subconsulta. Se alguma das comparacoes individuais leva a um resultado
      VERDADEIRO, o teste SOME retorna um valor VERDADEIRO. Os operadores SOME e ANY sao equivalentes. Nesse exemplo, o ativos
      de cada agencia e' comparado com todos os ativos das agencias do 'Brooklyn'.
