statement: Grouping and aggregating (1)
elements:
- type: explanation
  location:
    snippet: FROM boats B, reserves R
  explanations:
  - body: '''boats'' and ''reserves'' tables are renamed as B and R, respectively.'
- type: explanation
  location:
    snippet: WHERE R.bid = B.bid AND b.color = red
  explanations:
  - body: This condition tests two parts. Firstly, it tests whether the boats have been reserved by match the boat's bid with
      the bid in the 'reserves'. Secondly, the boat' color is limited to red.
- type: explanation
  location:
    snippet: GROUP BY B.bid;
  explanations:
  - body: The COUNT function is working with this GROUP BY clause. In order to calculated the number of rows, the results
      are group by the bid. And then, the COUNT function is performed.
