statement: Primary Key (1)
elements:
- type: explanation
  location:
    snippet: CREATE TABLE Enrolled
  explanations:
  - body: This table is to record enrollment information for each student, so both student ID and course ID are defined as
      the schema of 'Enrolled' table.
- type: explanation
  location:
    snippet: (sid CHAR(20),
  explanations:
  - body: '''sid'' is student ID and 20 digits character type.'
- type: explanation
  location:
    snippet: cid CHAR(20),
  explanations:
  - body: '''cid'' is course ID and 20 digits character type.'
- type: explanation
  location:
    snippet: grade CHAR(2),
  explanations:
  - body: '''grade'' is grade of each student and 2 digits character type.'
- type: explanation
  location:
    snippet: PRIMARY KEY (sid, cid));
  explanations:
  - body: A student can take a course only once and it is not allowable to take the same course twice. Students have a single
      grade for each course, because a primary key is specified using both sid and cid. A table's primary key must have a
      unique value for each row of the table.
