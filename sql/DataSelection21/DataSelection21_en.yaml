- type: explanation
  location:
    snippet: EXCEPT
  explanations:
  - body: The EXCEPT operation produces a single table containing the rows that appear in the first table but that do not
      appear in another table. It is important that the two tables must contain the same number of columns and the domain
      type of each column in both tables should be identical. <u>By default</u>, the EXCEPT operation eliminates duplicate
      rows as part of its processing. If you want to retain duplicate rows, you can specify the ALL keyword following the
      EXCEPT like 'EXCEPT ALL'
