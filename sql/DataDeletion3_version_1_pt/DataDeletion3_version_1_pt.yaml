- type: explanation
  location:
    snippet: WHERE balance <
  explanations:
  - body: |-
      The order of this query execution is firstly, the subquery to calculate the average amount of all account is executed and then the balance of each account is compared with the average. Lastly, the corresponding account is deleted. <br>To limit the data, balance data is compared with the average balance in subquery result.

      Primeiramente, a subconsulta e' executada para calcular o valor medio do saldo das contas e, em seguida, o saldo e' comparado com a media. Por fim, a conta que possui saldo menor que a media e' excluida.
- type: explanation
  location:
    snippet: (SELECT AVG(balance)
  explanations:
  - body: Esta subconsulta calcula o valor medio do saldo das contas.
