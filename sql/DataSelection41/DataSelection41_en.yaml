statement: Aggregating Derived Relations
elements:
- type: explanation
  location:
    snippet: SELECT temp.rating, temp.average
  explanations:
  - body: To make the previous example properly, derived relations and comparison using WHERE clause can be used. This example
      is also to select those ratings for which the average age is the minimum over all ratings. 'temp' in front of the each
      column is the name of derived relation.
- type: explanation
  location:
    snippet: (SELECT S.rating, AVG(S.age) AS avgage
  explanations:
  - body: This subquery is used with FROM. So it is derived relation. It is to calculate average age of sailors for each ratings.
      The sailors are grouped by their ratings and the age is averaged over each group. The averaged value is renamed as 'avgage'.
- type: explanation
  location:
    snippet: GROUP BY S.rating) AS temp
  explanations:
  - body: The whole derived subquery is renamed as 'temp'. Once the derived relation is renamed, the new name can be used
      in outer query.
- type: explanation
  location:
    snippet: WHERE temp.avgage =
  explanations:
  - body: The avgage value in derived relation is compared with second subquery.
- type: explanation
  location:
    snippet: (SELECT MIN(temp.avgage)
  explanations:
  - body: This query is to calculate minimum average value ('avgage') in derived relation, 'temp'.
