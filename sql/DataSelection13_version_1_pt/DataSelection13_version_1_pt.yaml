elements:
- type: explanation
  location:
    snippet: SELECT customer_no, borrower.loan_no, amount
  explanations:
  - body: Essa consulta retorna as colunas 'customer_no' e 'amount' da tabela 'loan' e a coluna 'loan_no' da tabela 'borrower'.
      Note que a coluna 'loan_no' requer o nome da tabela (borrower) como prefixo porque ambas as tabelas 'borrower' e 'loan'
      possuem uma coluna com o este nome. Se o nome da tabela nao for especificado, a coluna deve ser unica dentre a tabelas
      contidas na clausula FROM.
- type: explanation
  location:
    snippet: FROM borrower, loan
  explanations:
  - body: Os dados sao lidos de duas tabelas diferentes.
- type: explanation
  location:
    snippet: WHERE borrower.loan_no = loan.loan_no AND branch_name = 'Perryridge';
  explanations:
  - body: Para que o valor do emprestimo seja emparelhado corretamente com o cliente, essa condicao testa se o numero do emprestimo
      (loan_no) e' o mesmo nas duas tabelas. Adicionalmente, apenas os emprestimos da agencia 'Perryridge' sao retornados.
      Apenas as tuplas que satisfazem as duas condicoes sao retornadas como resultado por causa do operador logico AND.
