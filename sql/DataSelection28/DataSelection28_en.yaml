statement: Nested Subqueries (1)
elements:
- type: explanation
  location:
    snippet: SELECT DISTINCT customer_name
  explanations:
  - body: The subquery covered by round parenthesis is calculated at first and then using set membership test, the results
      are compared with main query results. <Br>By specifying DISTINCT, duplications in customer_name are eliminated.
- type: explanation
  location:
    snippet: WHERE customer_name IN
  explanations:
  - body: IN set membership test is to see whether a data value matches one of a list of target values. For instance, 'X IN
      (A, B, C)' is completely equivalent to '(X = A) OR (X = B) OR (X = C)'. In this example, customer name is tested with
      the customer names in 'depositor' table.
- type: explanation
  location:
    snippet: (SELECT customer_name
  explanations:
  - body: SQL provides a mechanism for nesting subqueries. A subquery is a SELECT-FROM-WHERE statement or statement containing
      GROUP BY and HAVING that is nested within another query. <br>This query is to find customer name having account.
