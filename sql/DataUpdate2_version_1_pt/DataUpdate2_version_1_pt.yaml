- type: explanation
  location:
    snippet: UPDATE Students S
  explanations:
  - body: O comando UPDATE e' utilizado para modificar os valores de uma ou mais colunas das linhas selecionadas.
- type: explanation
  location:
    snippet: SET S.age = S.age+1 AND S.gpa = S.gpa-1
  explanations:
  - body: A clausula SET especifica uma lista de atribuicoes, sendo que cada atribuicao define o novo valor a ser atualizado.
- type: explanation
  location:
    snippet: WHERE S.sid = 5368;
  explanations:
  - body: Uma unica tupla ou varias tuplas podem ser atualizadas no mesmo comando, dependendo da condicao definida na clausula
      WHERE.
