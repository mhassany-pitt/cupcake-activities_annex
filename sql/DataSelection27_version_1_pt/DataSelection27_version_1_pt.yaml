elements:
- type: explanation
  location:
    snippet: WHERE amount IS NULL;
  explanations:
  - body: O predicado IS NULL e' utilizado para comparar valores nulos. Se o valor comparado e' nulo, a condicao retorna o
      resultado VERDADEIRO e vice-versa. NULL e' apenas uma palavra-chave para indicar um valor desconhecido. Mesmo que a
      comparacao 'amount = null' fosse correta, as regras seriam diferentes do que esperamos. Uma comparacao como essa seria
      'Valor Conhecido = Valor Desconhecido', o que e' impossivel de julgar se e' VERDADEIRO ou FALSO.
