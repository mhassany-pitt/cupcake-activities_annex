statement: Multiple Table Selection (1)
elements:
- type: explanation
  location:
    snippet: SELECT S.name, E.cid
  explanations:
  - body: This example is to retrieve student's name and course id.
- type: explanation
  location:
    snippet: FROM Student S, Enrolled E
  explanations:
  - body: The FROM clause identifies all of the tables that contribute data to the query results. This SQL statement retrieves
      data from two tables - Students and Enrolled. If a query refers to another user's talbe or the name of the table is
      very long, it becomes easier to use shorter aliases like S, and E for the two tables. Once table aliases are defined,
      it is important to specify table alias in column select list. 'name' column is attached to 'Students' table alias S,
      and 'cid' is attached to 'Enrolled' table alias E.
- type: explanation
  location:
    snippet: WHERE S.sid = E.sid AND E.grade = "A";
  explanations:
  - body: In condition, table aliases also are used. It compares sid column values in both 'Students' and 'Enrolled'. <br>This
      condition is to find the students who get A grade.
