elements:
- type: explanation
  location:
    snippet: SELECT City, Sales, Target
  explanations:
  - body: This is to choose cities, the sales amount and the target amount from 'Offices' table.
- type: explanation
  location:
    snippet: WHERE Sales < (.8 * Target);
  explanations:
  - body: This is to find sales less than 80 percent of the target amount. To process this condition, SQL constructs a temporary
      column containing the value of the expression (.8 * Target), 'Target' is one column in 'Offices' table and then compares
      them with values in 'Sales' column.
