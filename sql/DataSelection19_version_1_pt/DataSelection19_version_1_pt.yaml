- type: explanation
  location:
    snippet: UNION
  explanations:
  - body: A operacao UNION combina os resultados de duas ou mais consultas em uma unica tabela de resultado. A principal restricao
      da operacao UNION e' que as subconsultas devem possuir o mesmo numero de colunas retornadas e tambem os tipos de dados
      das colunas devem coincidir. Como a operacao UNION combina dois ou mais conjuntos de resultados, o resultado final pode
      conter linhas repetidas. Entretanto, <u>por padrao</u>, a operacao UNION elimina as linhas duplicadas como parte de
      seu processamento. Caso queira manter as linhas duplicadas, a palavra-chave ALL pode ser utilizada depois da palavra
      UNION, como 'UNION ALL'.
