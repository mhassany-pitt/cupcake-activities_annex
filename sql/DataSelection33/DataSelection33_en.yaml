statement: Derived Relations
elements:
- type: explanation
  location:
    snippet: SELECT branch_name, avg_balance
  explanations:
  - body: In this example, an derived subquery is used in the FROM clause.  The column names used in this main query is not
      from the original 'account' table. It is aliase name from the derived subquery relation.
- type: explanation
  location:
    snippet: FROM
  explanations:
  - body: SQL allows a subquery expression to be used in the FROM clause and this is the derived relations.
- type: explanation
  location:
    snippet: (SELECT branch_name, AVG(balance)
  explanations:
  - body: This subquery is to select branch name and average account value of branch.
- type: explanation
  location:
    snippet: FROM account
  explanations:
  - body: Note that we do not need to use the HAVING clause, since we compute the temporary relation <i>branch_avg</i> in
      the FROM clause, and the attributes of <i>branch_avg</i> can be used directly in the WHERE clause.
- type: explanation
  location:
    snippet: GROUP BY branch_name)
  explanations:
  - body: This GROUP BY clause is used in derived relation.
- type: explanation
  location:
    snippet: AS branch_avg(branch_name, avg_balance))
  explanations:
  - body: The derived subquery and the two columns are renamed using tuple variables, AS. Hence, the whole subquery is 'branch_avg',
      the first column is 'branch_name' and the second column is 'avg_balance'.
- type: explanation
  location:
    snippet: WHERE avg_balance > 1200;
  explanations:
  - body: In order to limit the value of avg_balance column WHERE clause is used. Because the derived relations is temporal
      table and the test value, avg_balance, is read from the table directly, there is no need to used HAVING comparison.
