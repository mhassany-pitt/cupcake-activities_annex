- type: explanation
  location:
    snippet: WHERE S.age > 18
  explanations:
  - body: Not all sailors are taken into consideration. Sailors older than 18 years are selected.
- type: explanation
  location:
    snippet: GROUP BY S.rating
  explanations:
  - body: The sailors' ratings are grouped.
- type: explanation
  location:
    snippet: HAVING 1 <
  explanations:
  - body: This query firstly limit ratings having at least two sailors in the rating. The total number of each ratings that
      sailors are beloning to is compared with 1.
- type: explanation
  location:
    snippet: (SELECT COUNT(*)
  explanations:
  - body: This subquery is to count the number of sailors belonging to each ratings.
