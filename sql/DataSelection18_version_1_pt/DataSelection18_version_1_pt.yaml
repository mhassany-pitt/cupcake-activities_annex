elements:
- type: explanation
  location:
    snippet: SELECT DISTINCT customer_name
  explanations:
  - body: A palavra-chave DISTINCT elimina tuplas repetidas. Nesse exemplo, os clientes com emprestimo serao mostrados em
      ordem alfabetica sem repeticao.
- type: explanation
  location:
    snippet: FROM borrower AS T, loan AS S
  explanations:
  - body: Os apelidos das tabelas sao definidos para ambas as tabelas, 'borrower' e 'loan'. O apelido pode ser utilizado quando
      o nome da tabela for muito grande ou por conveniencia do programador.
- type: explanation
  location:
    snippet: WHERE T.loan_no = S.loan_no
  explanations:
  - body: Condicao para realizar a correspondencia do numero do emprestimo (loan_no) nas duas tabelas.
- type: explanation
  location:
    snippet: ORDER BY customer_name;
  explanations:
  - body: Pode-se definir a coluna a ser ordenada utilizando a clausula 'ORDER BY'. Para ordenar de forma decrescente, utilize
      a palavra-chave DESC e para ordenar de forma ascendente utilize a palavra-chave ASC. Essas palavras podem ser colocadas
      apos o nome da coluna. Por padrao, a ordenacao acontece de forma ascendente.
