statement: Deleting with Condition (1)
elements:
- type: explanation
  location:
    snippet: DELETE FROM account
  explanations:
  - body: The target table 'account' is specified.
- type: explanation
  location:
    snippet: WHERE branch_name IN
  explanations:
  - body: IN is set membership test. It tests whether a data value matches on of a list of target values. The IN in this line
      compares branch names with the subquery results that are branches in 'Brookly'.
- type: explanation
  location:
    snippet: (SELECT branch_name
  explanations:
  - body: In this example, the subquery to find branch located in 'Brooklyn' is used and by comparing the list of results,
      they choose the accounts opened in the branches.
- type: explanation
  location:
    snippet: WHERE branch_city = 'Brooklyn');
  explanations:
  - body: WHERE clause is to choose certain rows of data by condition. 'WHERE' keyword is followed by the comparison and this
      example is to choose the rows which is located in 'Brookly' as the branch city and delete the information. 'branch_city'
      column has character domain type, so in order to compare the value, the test value should be character too. In addition,
      the test value 'Brookly' is embraced with single quotation, because it is character.
