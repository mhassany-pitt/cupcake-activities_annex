- type: explanation
  location:
    snippet: WHERE branch_name IN
  explanations:
  - body: A palavra-chave IN e' utilizada para uma operacao de conjuntos. Testa se um dado esta contido em uma lista de valores.
      Neste exemplo, compara os nomes das agencias com os resultados da subconsulta.
- type: explanation
  location:
    snippet: (SELECT branch_name
  explanations:
  - body: Nesse exemplo, a subconsulta procura por agencias localizadas no 'Brooklyn' para apagar as contas que foram abertas
      nas agencias retornadas.
- type: explanation
  location:
    snippet: WHERE branch_city = 'Brooklyn');
  explanations:
  - body: A clausula WHERE seleciona as linhas baseado em uma condicao. A palavra-chave 'keyword' e' seguida por uma comparacao.
      Neste exemplo, seleciona-se as tuplas de agencias que estao localizadas no 'Brooklyn'. A coluna 'branch_city' e' do
      tipo caractere e, por isso, o valor utilizado na comparacao deve estar entre aspas.
