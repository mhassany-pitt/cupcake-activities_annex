elements:
- type: explanation
  location:
    snippet: SELECT COUNT(*)
  explanations:
  - body: The COUNT() aggregate function calculate the total number of tuples. If the column name is specified as a part of
      the operation, it counts the number of values in a column. For example, COUNT(customer_name) is to calculate the total
      number of 'customer_name' values. COUNT(*) is to count rows of query results.
