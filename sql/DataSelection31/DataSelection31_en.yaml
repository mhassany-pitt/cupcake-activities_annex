statement: Comparing Subquery Results (2)
elements:
- type: explanation
  location:
    snippet: WHERE assets > ALL
  explanations:
  - body: The ALL test is used in conjunction with one of the six SQL comparison operators (=, <>, <, <=, >, >=) to compare
      test value to the results of subquery. If all of the individual comparsions yield a TRUE results, the ALL test returns
      a TRUE result. In this example, the asset of each branch is compared with all assets of 'Brooklyn' branches and the
      ALL values of 'Brooklyn' branches are smaller than the asset, it is retrieved.
- type: explanation
  location:
    snippet: (SELECT assets
  explanations:
  - body: This is to find assets of branch opened in 'Brooklyn'.
