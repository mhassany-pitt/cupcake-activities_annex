elements:
- type: explanation
  location:
    snippet: SELECT sid
  explanations:
  - body: In SELECT statement, SELECT and FROM clauses are required. The SELECT clause can specify the column(s) in the table
      to be retrieved. The items are usually specified by a list of columns, separated by commas. In this example, only one
      column - sid - is selected, hence there is no need to be separated by comma.
- type: explanation
  location:
    snippet: FROM Student;
  explanations:
  - body: The FROM clause lists the tables that contain the tuple to be retrieved by the query. Data can be drawn from one
      table or multiple tables.
