statement: Inserting Data (2)
elements:
- type: explanation
  location:
    snippet: INSERT INTO Students(sid, name, login, age, gpa)
  explanations:
  - body: '''INTO'' clause which is mantantory in ''INSERT'' clause is to specify the table and columns to store data. The
      order of inserted data should be matched with the order of each column specified in SQL statement. If the column names
      are omitted, the data are inserted by the column order of table definition.'
- type: explanation
  location:
    snippet: VALUES('53688', 'Smith', 'smith@ee', 18, 3.2);
  explanations:
  - body: '''VALUES'' keyword is necessary to define the inserted data. The value for sid, name, or login whose domain types
      are character is surrounded by single quotation mark.'
