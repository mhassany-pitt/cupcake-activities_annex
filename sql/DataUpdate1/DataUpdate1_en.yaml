statement: Updating Data (2)
elements:
- type: explanation
  location:
    snippet: UPDATE Students S
  explanations:
  - body: The 'UPDATE' keyword is followed by table 'Students' and the table is renamed as 'S' because it is little bit long
      to use.
- type: explanation
  location:
    snippet: SET S.gpa = S.gpa*1.01
  explanations:
  - body: The SET clause is mandantory in UPDATE statement and it specifies which columns are to be updated. Because table
      name is renamed as 'S' the column name is assigned by it using dot. Each instance in 'gpa' is read, calculates 101%
      of the value, and is reassigned to new value.
- type: explanation
  location:
    snippet: WHERE S.gpa >= 3.3;
  explanations:
  - body: Not all instances are updated and gpas which is just equal or higher than 3.3 are selected.
