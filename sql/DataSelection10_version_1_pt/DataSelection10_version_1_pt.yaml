elements:
- type: explanation
  location:
    snippet: SELECT S.name, E.cid
  explanations:
  - body: Esse exemplo retorna o nome do aluno e o ID das disciplinas matriculadas.
- type: explanation
  location:
    snippet: FROM Student S, Enrolled E
  explanations:
  - body: A clausula FROM identifica todas as tabelas que contribuem para o resultado da consulta. Esse SQL retorna dados
      de duas tabelas - Students e Enrolled. Se uma consulta referencia mais de uma tabela ou o nome da tabela e' muito grande,
      pode-se utilizar apelidos mais curtos como S ou E para as tabelas em questao. Uma vez que os apelidos sao definidos,
      deve-se especificar os apelidos das tabelas na lista de colunas a serem retornadas. Nesse exemplo, a coluna 'name' pertence
      a tabela 'Students' com apelido S e a coluna 'cid' pertence a tabela 'Enrolled' com apelido E.
- type: explanation
  location:
    snippet: WHERE S.sid = E.sid AND E.grade = "A";
  explanations:
  - body: Na condicao da clausula WHERE, os apelidos das tabelas tambem sao utilizados. Nesta linha, a coluna 'cid' e' comparada
      em ambas as tabelas 'Students' e 'Enrolled'. Alem disso, retorna apenas alunos que obtiveram nota A na disciplina.
