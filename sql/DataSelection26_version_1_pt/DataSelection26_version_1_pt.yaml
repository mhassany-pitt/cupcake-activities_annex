- type: explanation
  location:
    snippet: GROUP BY branch_name
  explanations:
  - body: O resultado e' agrupado e condensado para cada nome de agencia (branch_name).
- type: explanation
  location:
    snippet: HAVING AVG(balance) > 600;
  explanations:
  - body: Assim como a clausula WHERE, a clausula HAVING pode ser utilizada para selecionar e excluir linhas de determinados
      grupos. <br/> Conforme especificado pelo GROUP BY, a informacao de saldo e' agrupada e totalizada por nome de agencia
      e entao a media dos saldos e' calculada. Se a media dos subtotal for maior que 600, entao a tupla e' retornada. O formato
      da clausula HAVING e' similar ao formato da clausula WHERE, mas a clausula HAVING pode ser usada como um grupo.
