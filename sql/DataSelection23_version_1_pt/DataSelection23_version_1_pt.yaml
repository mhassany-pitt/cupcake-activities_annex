- type: explanation
  location:
    snippet: SELECT COUNT(*)
  explanations:
  - body: A funcao de agregacao COUNT() calcula a quantidade de tuplas retornadas. Se o nome da coluna for especificado, a
      funcao retorna o numero de valores naquela coluna. Por exemplo, COUNT(customer_name) e' utilizado para calcular a quantidade
      de valores contidos na coluna 'customer_name' e COUNT(*) e' utilizado para contar a quantidade de linhas retornadas
      pela consulta.
