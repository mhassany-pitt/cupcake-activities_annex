elements:
- type: explanation
  location:
    snippet: CREATE VIEW v AS
  explanations:
  - body: Uma VIEW e' uma tabela virtual no banco de dados cujo conteudo e' definido por uma consulta. Para os usuarios, uma
      VIEW parece ser uma tabela real, mas as linhas e as colunas visiveis atraves da VIEW sao, na verdade, o resultado de
      uma consulta que define a VIEW. O comando SQL para criar uma nova VIEW deve comecar com 'CREATE VIEW' seguido pelo nome
      da view. As colunas da view sao definidas depois da palavra-chave 'AS'.
- type: explanation
  location:
    snippet: (SELECT customer_name, loan_no
  explanations:
  - body: Esta e' a consulta que define a VIEW e retorna o nome e o ID do emprestimo dos clientes que possuem algum emprestimo.
- type: explanation
  location:
    snippet: FROM borrower, loan
  explanations:
  - body: Quando o SGBD encontra uma referencia para uma view em uma declaracao SQL, ele encontra a definicao da view e, entao,
      o SGBD traduz a requisicao que referencia a view em uma requisicao equivalente diretamente nas tabelas e a executa.
- type: explanation
  location:
    snippet: WHERE borrower.loan_no = loan.loan_no);
  explanations:
  - body: 'As VIEWS fornecem varios beneficios e podem ser uteis em diferentes tipos de bancos de dados. Seus principais beneficios
      sao: <ul><li>Seguranca: Os usuarios podem ter permissao para acessar o banco de dados apenas por meio de um pequeno
      conjunto de views.</li><li>Simplicidade de consulta: Uma view pode conter dados de diversas tabelas e apresenta-los
      em uma unica tabela, fazendo com que consultas multitable se tornem consultas em uma unica tabela.</li><li>Simplicidade
      estrutural: Views podem dar aos usuarios uma visao personalizada do banco de dados.</li><li>Isolamento de mudancas:
      Uma view pode apresentar uma imagem consistente e sem alteracoes da estrutura do banco de dados, mesmo que as tabelas
      de origem sejam divididas, reestruturadas ou renomeadas.</li><li>Integridade de dados: Se os dados sao acessados e inseridos
      atraves de views, o SGBD consegue verificar automaticamente os dados para garantir restricoes de integridade especificadas.</li></ul>Enquanto
      as views proporcionam vantagens significativas, existem dois grandes inconvenientes: <ul><li>Desempenho: Se a view for
      definida por uma consulta multitable complexa entao uma simples consulta nessa view se torna uma juncao complicada e
      pode demorar muito tempo para ser executada.</li><li>Restricoes de atualizacao: Atualizar tuplas de uma view e'' possivel
      apenas para views simples e views mais complexas nao podem ser atualizadas; elas sao somente leitura.</li></ul>'
