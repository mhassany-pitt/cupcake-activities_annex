statement: Grouped Queries with Condition
elements:
- type: explanation
  location:
    snippet: GROUP BY branch_name
  explanations:
  - body: The result data is grouped and summarized for each branch_name.
- type: explanation
  location:
    snippet: HAVING AVG(balance) > 600;
  explanations:
  - body: Just as the WHERE clause, the HAVING clause can be used to select and reject row groups. <br>As specified by 'group
      by', the balance data is group and subtotalled up by branch_name and then the average of subtotal balance is calculated.
      If the average of subtotal is greater than 600, the data is retrieved. The format of the HAVING clause parallels that
      of the WHERE clause, but this HAVING clause can be used as a GROUP.
