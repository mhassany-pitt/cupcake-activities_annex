elements:
- type: explanation
  location:
    snippet: CREATE TABLE Students
  explanations:
  - body: O comando utilizado para criar uma nova tabela comeca com a clausula 'CREATE TABLE' seguida pelo nome da tabela
      a ser criada. Perceba que nao pode existir uma outra tabela com o mesmo nome no mesmo banco de dados.
- type: explanation
  location:
    snippet: (sid VARCHAR(20) NOT NULL,
  explanations:
  - body: Coluna com nome 'sid', tipo de dados caractere com no maximo 20 letras e nao permite valores nulos. <br> As colunas
      da nova tabela criada sao definidas no corpo da clausula CREATE TABLE. Primeiramente, toda coluna da tabela deve possuir
      um nome unico seguido do tipo de dados que sera armazenado na coluna. Em seguida, deve-se indicar se a coluna requer
      preenchimento obrigatorio ou nao (permite ou nao valores nulos).
- type: explanation
  location:
    snippet: name VARCHAR(20),
  explanations:
  - body: Cada definicao de coluna deve ser separada por uma virgula.
- type: explanation
  location:
    snippet: login VARCHAR(10),
  explanations:
  - body: O tipo de dados VARCHAR permite que a coluna armazene textos com tamanhos variados a cada linha. O tipo de dados
      CHAR tambem permite o armazenamento de textos, entretanto seu tamanho e' fixo, independente se o texto armazenado ocupa
      todo o espaco ou nao.
- type: explanation
  location:
    snippet: age INTEGER DEFAULT NULL,
  explanations:
  - body: A coluna 'age' e' do tipo inteiro e se nenhum valor for informado, o SGBD automaticamente preenche a tupla com o
      valor NULL por causa da definicao DEFAULT como 'NULL'.
- type: explanation
  location:
    snippet: gpa REAL DEFAULT 0.00);
  explanations:
  - body: A coluna 'gpa' possui o valor padrao 0.00. A clausula 'CREATE TABLE' termina com o fechamento de parenteses. <br><br>Toda
      consulta SQL termina com ponto-e-virgula (;).
