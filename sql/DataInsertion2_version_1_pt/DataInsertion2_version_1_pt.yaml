elements:
- type: explanation
  location:
    snippet: INSERT INTO Students(sid, name, login, age, gpa)
  explanations:
  - body: A clausula 'INTO' e' obrigatoria no comando 'INSERT' e serve para especificar a tabela e as colunas em que a nova
      tupla sera inserida. A ordem de insercao dos dados deve corresponder a ordem especificada nessa clausula. Se o nome
      das colunas for omitido, os dados sao inseridos na ordem em que as colunas foram definidas na criacao da tabela.
- type: explanation
  location:
    snippet: VALUES('53688', 'Smith', 'smith@ee', 18, 3.2);
  explanations:
  - body: A palavra-chave 'VALUES' e' necessaria para definir os dados que serao inseridos. Os valores para 'sid', 'name'
      e 'login', que sao do tipo caractere, deve ser cercados por aspas.
