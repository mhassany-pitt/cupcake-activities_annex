elements:
- type: explanation
  location:
    snippet: INSERT INTO Students(sid, name, age)
  explanations:
  - body: Student 'Jamie Done' who is 22 years old and his student id number, '2007001' are inserted into 'Students' table.
- type: explanation
  location:
    snippet: VALUES('2007001', 'Jamie Done', 22);
  explanations:
  - body: VALUES clause is to define the inserted value. The order of values should correspond to the column order. Especially,
      if the column has character domain type, it is embraced by single/double quotation. 'sid' and 'name' column have character
      domain type, so the value has single quotation.
