- type: explanation
  location:
    snippet: CREATE TABLE course
  explanations:
  - body: This example is to create table for course and course ID and course name are the information to be stored.
- type: explanation
  location:
    snippet: (cid CHAR(20) NOT NULL PRIMARY KEY,
  explanations:
  - body: Course ID is defined as 'cid'. This column is not allowed to have null value. <BR><BR>Primary key specifies an unique
      identifier for each row of the table. That is to say, there is not more than one course IDs that are the same. In addition,
      the column defined as primary key is not allowed to be null.
