statement: Aggregating Subquery
elements:
- type: explanation
  location:
    snippet: SELECT branch_name
  explanations:
  - body: Firstly, average value of all branches are calculated in subquery and then using ALL test, the average account value
      of each branch is compared with the subquery results.
- type: explanation
  location:
    snippet: FROM account
  explanations:
  - body: This to find the branches with the largest average account balance.
- type: explanation
  location:
    snippet: GROUP BY branch_name
  explanations:
  - body: This is to group the account balance according to the branch.
- type: explanation
  location:
    snippet: HAVING AVG(balance) >= ALL
  explanations:
  - body: This is condition to find the largest average account value using ALL test. Just as the WHERE clause can be used
      to select and reject the individual rows, the HAVING clause can be used to select and reject row groups. The format
      of the HAVING clause parallels that of the WHERE clause, but this HAVING clause can be used as a GROUP search conditions.
      To perform this >= comparison, the balance is grouped by the branch_name and the average value is calculated. The calculated
      single value is compared with ALL average value of each branch and if they are smaller or equal to the single value,
      it yields TRUE.
- type: explanation
  location:
    snippet: (SELECT AVG(balance)
  explanations:
  - body: This is to calculated average account value of each branch.
- type: explanation
  location:
    snippet: GROUP BY branch_name);
  explanations:
  - body: This is to specify to group the balance value by branch and then the grouped value is calculated in AVG function.
