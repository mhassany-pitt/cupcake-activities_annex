elements:
- type: explanation
  location:
    snippet: CREATE TABLE Enrolled
  explanations:
  - body: Essa tabela armazena as informacoes de matricula dos alunos. Existe uma outra tabela para alunos (Students) cuja
      chave primaria e' 'sid'.
- type: explanation
  location:
    snippet: (sid CHAR(20) NOT NULL,
  explanations:
  - body: A coluna 'sid' e' o identificador do aluno. Antes de ser definida como parte da tabela 'Enrolled', ela tambem foi
      definida na tabela 'Students'.
- type: explanation
  location:
    snippet: cid CHAR(20) NOT NULL,
  explanations:
  - body: Coluna para armazenar o identificador da disciplina e possui tamanho fixo de 20 caracteres. Essa coluna nao pode
      conter valores nulos.
- type: explanation
  location:
    snippet: grade CHAR(2),
  explanations:
  - body: Coluna para armazenar a nota do aluno na disciplina e possui tamanho fixo de 2 caracteres.
- type: explanation
  location:
    snippet: PRIMARY KEY (sid,  cid),
  explanations:
  - body: Para cada aluno e disciplina, existe uma unica nota.
- type: explanation
  location:
    snippet: FOREIGN KEY (sid)
  explanations:
  - body: A coluna 'sid' nesta tabela e' uma chave estrangeira que referencia a tabela 'Students'. A clausula FOREIGN KEY
      identifica o relacionamento da tabela com outras tabelas no banco de dados. As colunas que formam o relacionamento sao
      chamadas de chave estrangeira.
- type: explanation
  location:
    snippet: REFERENCES Students
  explanations:
  - body: A palavra REFERENCES e' seguida pelo nome da tabela na qual a chave estrangeira 'sid' referencia. A palavra REFERENCES
      e' uma parte importante para especificar a tabela relacionada. As palavras-chave FOREIGN KEY e REFERENCES nao devem
      ser separadas por virgula. Se existir apenas o nome da tabela em seguida, o SGBD considera a chave primaria da tabela
      como a referencia para a chave estrangeira.
- type: explanation
  location:
    snippet: ON DELETE CASCADE
  explanations:
  - body: |-
      Se uma linha de uma ou mais chaves estrangeiras for apagada, a tupla que contem a chave estrangeira perde a referencia. Nesse exemplo, se o aluno com sid 'ktl123' for apagado na tabela 'Students', a tupla que contem o sid 'ktl123' na tabela 'Enrolled' se torna incapaz de saber as informacoes do aluno, porque perde sua referencia. Perceba que ao excluir uma linha da tabela 'Enrolled' nao causa nenhum problema. Se nenhuma regra for definida explicitamente, o SGBD aplica a regra padrao NO ACTION. <br/> <br/>
      A regra DELETE CASCADE diz ao SGBD para apagar automaticamente as linhas que contem uma chave estrangeira quando uma linha referenciada for apagada.
- type: explanation
  location:
    snippet: ON UPDATE SET DEFAULT);
  explanations:
  - body: Se uma chave estrangeira for modificada pela clausula UPDATE, o novo valor deve casar com o valor referenciado na
      tabela 'Students'. A regra SET DEFAULT diz ao SGBD que, quando um valor de uma linha referenciada por chaves estrangeiras
      for alterado, os valores da chave estrangeira em todas as linhas correspondetes devem ser alteradas para o valor padrao
      (default). Essa regra pode ser diferente de acordo com cada banco de dados. Em alguns SGBDs, a regra RESTRICT e' definida
      como SET NULL. Nesse caso, e' impossivel definir essa regra para uma chave primaria de uma tabela referenciada.
