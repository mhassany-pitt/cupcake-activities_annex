- type: explanation
  location:
    snippet: SELECT Name, Quota, Sales
  explanations:
  - body: 'Essa consulta recupera 3 colunas da tabela ''Salesperson'': ''Name'', ''Quota'' e ''Sales''.'
- type: explanation
  location:
    snippet: WHERE emp_no = 107;
  explanations:
  - body: |-
      Essa consulta SQL e' utilizada para recuperar as tuplas relacionadas com a pessoa cujo numero de empregado e' 107. <br/>
      A clausula WHERE e' utilizada para filtrar as linhas retornadas. Ela consiste da palavra-chave WHERE seguida pela condicao de pesquisa. A condicao de pesquisa pode ter 3 resultados: (1) se a condicao for VERDADEIRA, a tupla e' incluida no resultado da consulta; (2) Se a condicao for FALSA, a tupla nao e' incluida no resultado da consulta; e (3) se a condicao tem um valor NULL (valor desconhecido), a tupla nao e' incluida no resultado da consulta. Basicamente, a condicao de pesquisa funciona como um filtro para os registros de uma tabela. Registros que satisfazem a condicao passam pelo filtro e fazem parte do resultado da consulta.
