elements:
- type: explanation
  location:
    snippet: WHERE customer_street LIKE '%Main%';
  explanations:
  - body: 'SQL includes a substring-matching operator for comparisons on character strings. The operator "like" uses patterns
      that are described using two special characters: <ul><li>percent(%): The % character matches any substring.<li>underscore(_):
      the _ character matches any character.</ul><br>The percent sign (%) wildcard character matches any sequence of zero
      or more character. Wherever the ''Main'' charater is located in the customer street data, it turns out to be true. Any
      of the following data  would match the pattern. <br>Pittsburgh Main Street, Chrismain Blvd, Main Government Bulding,
      Aid first Main.'
