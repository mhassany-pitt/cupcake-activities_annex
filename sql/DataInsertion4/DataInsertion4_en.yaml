elements:
- type: explanation
  location:
    snippet: INSERT INTO depositor
  explanations:
  - body: The data is inserted into 'depositor' table.
- type: explanation
  location:
    snippet: SELECT customer_name, loan_no
  explanations:
  - body: To assign created accounts to customers belonging to 'Perryridge', 'customer_name' in borrower table and 'loan_no'
      in loan table is selected. The data stored in the target 'depositor' table are these two data.
- type: explanation
  location:
    snippet: FROM loan, borrower
  explanations:
  - body: '''customer_name'' is from ''borrower'' table and ''loan_no'' is from ''loan'' table.'
- type: explanation
  location:
    snippet: WHERE branch_name ='Perryridge'
  explanations:
  - body: This is to choose customer from 'Perryridge' branch.
- type: explanation
  location:
    snippet: AND loan.accont_no = borrower.account_no;
  explanations:
  - body: This is to check whether each borrower has loan account.
