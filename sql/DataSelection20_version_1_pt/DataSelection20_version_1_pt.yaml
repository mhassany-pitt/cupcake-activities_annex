- type: explanation
  location:
    snippet: INTERSECT
  explanations:
  - body: A operacao INTERSECT produz uma unica tabela com as tuplas que aparecem nos resultados das outras consultas. O resultado
      das duas consultas deve possuir o mesmo numero de colunas e com mesmos tipos de dados. <u>Por padrao</u>, a operacao
      INTERSECT elimina as linhas repetidas. Caso queira manter as linhas repetidas, a palavra-chave ALL pode ser usada depois
      da palavra INTERSECT, como 'INTERSECT ALL'.
