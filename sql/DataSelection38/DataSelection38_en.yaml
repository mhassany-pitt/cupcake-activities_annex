    snippet: (SELECT MIN (AVG(S2.age))
  explanations:
  - body: This example is WRONG, because aggregate operations cannot be nested. This query tried to calculate average age
      of sailors and minimum value of it again. AVG function cannot be nested by another aggregate function.
