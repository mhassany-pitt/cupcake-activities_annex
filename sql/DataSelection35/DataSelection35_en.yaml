statement: View Creation (2)
elements:
- type: explanation
  location:
    snippet: CREATE VIEW all_customer AS
  explanations:
  - body: A VIEW is a virtual table in the database whose contents are defined by a query. To users, the VIEW appears like
      a real table, but the rows and columns of data visible through the VIEW are the query results produced by the query
      defining the VIEW.
- type: explanation
  location:
    snippet: (SELECT branch_name, customer_name
  explanations:
  - body: This is the first query is to find the customers having account and the branch.
- type: explanation
  location:
    snippet: UNION
  explanations:
  - body: VIEW is for multi-table combination as a one table. Hence, by using UNION it is possible to add up two different
      SQL query results. UNION is to combine two results from separate queries into one results without duplicate.
