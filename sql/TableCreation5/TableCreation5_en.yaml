- type: explanation
  location:
    snippet: CREATE TABLE Reserves
  explanations:
  - body: This is to create table named 'Reserves'. It has three columns - sname, bid, and day.
- type: explanation
  location:
    snippet: (sname CHAR(10),
  explanations:
  - body: '''sname'' column is 10 ditigs character domain type.'
- type: explanation
  location:
    snippet: bid INTEGER,
  explanations:
  - body: '''bid'' is integer domain type.'
- type: explanation
  location:
    snippet: day DATE,
  explanations:
  - body: '''day'' is date domain type.'
- type: explanation
  location:
    snippet: PRIMARY KEY(bid, day),
  explanations:
  - body: One boat have to be reserved once in a day.
- type: explanation
  location:
    snippet: CONSTRAINT noInterlakeRes
  explanations:
  - body: This is to define CHECK constraint. Before defining constraint, it is capable to specify the constraint name. The
      following CHECK constraint is named as 'noInterlakeRes'.
- type: explanation
  location:
    snippet: CHECK
  explanations:
  - body: CHECK contraint is a search condition that produces a true/false value. When a check constraint is specified for
      a column, the DBMS authomatically checks the value of that column each time a new row is inserted or a row is updated
      to ensure that the search condition is true. A column check constraint is specified as part of the column definition
      within the CREATE TABLE statement.
- type: explanation
  location:
    snippet: ('Interlake' <>
  explanations:
  - body: In this example, CHECK constraint named 'noInterlakeRes' is to check whether the name of boat ('bname') that a person
      want to reserve is 'Interlake'. It is to limit the reservation of 'Interlake' boat.
- type: explanation
  location:
    snippet: (SELECT B.bname
  explanations:
  - body: This subquery is to specify the condition should be checked for 'Interlake' column. This subquery is to read boat
      name from 'boats' table.
- type: explanation
  location:
    snippet: WHERE B.bid = bid)));
  explanations:
  - body: This is to read boat name in 'boats' table corresponding to the boat id.
