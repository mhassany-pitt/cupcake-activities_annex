statement: Range Test (1)
elements:
- type: explanation
  location:
    snippet: WHERE amount BETWEEN 2000 AND 100000;
  explanations:
  - body: BETWEEN clause is range test operator. The range test checks whether a data value lies between two specified values.
      The left part of AND keyword is the low ends of value and right part is high ends of the range to be tested.  This is
      completely equivalent to (amount >= 2000) AND (amount <=100000)
