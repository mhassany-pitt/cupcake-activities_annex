elements:
- type: explanation
  location:
    snippet: UPDATE Students S
  explanations:
  - body: A palavra-chave 'UPDATE' deve ser seguida pelo nome da tabela (neste caso tabela 'Students'), que foi renomeada
      para S para nao ser necessario digitar a palavra 'Students' sempre.
- type: explanation
  location:
    snippet: SET S.gpa = S.gpa*1.01
  explanations:
  - body: A clausula SET e' obrigatoria no comando UPDATE e serve para indicar qual ou quais as colunas serao atualizadas.
      Como o nome da tabela foi renomeado para S, o nome da coluna deve ser acessado com um ponto (.). Nesta linha, o valor
      da coluna 'gpa' e' lido, calcula-se 101% do valor e atribui o resultado 'a mesma coluna.
- type: explanation
  location:
    snippet: WHERE S.gpa >= 3.3;
  explanations:
  - body: Nem todas as tuplas sao atualizadas, neste caso. Somente aquelas com valor maior ou igual a 3.3 sao atualizadas.
