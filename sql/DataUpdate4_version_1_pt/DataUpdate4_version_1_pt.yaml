  explanations:
  - body: Esse exemplo mostra que mais de uma condicao pode ser definida no mesmo SQL para que mais de uma tupla seja atualizada.
- type: explanation
  location:
    snippet: WHERE cust_rep IN (105, 106, 107);
  explanations:
  - body: A palavra-chave IN e' utilizada em operacoes de conjuntos. Ela testa se um valor esta contido em uma lista de valores.
      Nesse exemplo, se o valor da coluna 'cust_rep' for 105, 106 ou 107 entao a condicao se torna VERDADEIRA e as tuplas
      sao atualizadas.
