elements:
- type: explanation
  location:
    snippet: ALTER TABLE Student
  explanations:
  - body: The ALTER TABLE statement can be used to drop one or more columns from an existing table. Note that dropping a column
      can pose the data-integrity issues. For example, if you drop a column that is a primary key in some relationship, the
      foreign key columns that refer to the dropped column become invalid.
- type: explanation
  location:
    snippet: DROP COLUMN age;
  explanations:
  - body: DROP COLUMN clause is followed by the column name to be dropped - 'age'
