- type: explanation
  location:
    snippet: ALTER TABLE Student
  explanations:
  - body: A clausula ALTER TABLE por ser utilizada para excluir uma ou mais colunas de uma tabela existente. Note que a exclusao
      de uma coluna pode resultar em erros de integridade de dados. Por exemplo, ao excluir uma coluna que e' uma chave primaria
      em algum relacionamento, as colunas relacionadas com as chaves estrangeiras para a coluna excluida se tornam invalidas.
- type: explanation
  location:
    snippet: DROP COLUMN age;
  explanations:
  - body: A clausula DROP COLUMN e' seguida pelo nome da coluna a ser excluida - 'age'.
