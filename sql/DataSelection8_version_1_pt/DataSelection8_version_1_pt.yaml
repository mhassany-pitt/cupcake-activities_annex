- type: explanation
  location:
    snippet: SELECT City, Sales, Target
  explanations:
  - body: Essa consulta retorna as colunas 'City', 'Sales' e 'Target' da tabela 'Offices'.
- type: explanation
  location:
    snippet: WHERE Sales < (.8 * Target);
  explanations:
  - body: Apenas as vendas menores que 80% do valor da meta (Target). Para processar essa condicao, o SQL cria uma coluna
      temporaria contendo o valor da expressao (.8 * Target), sendo que 'Target' e' uma das colunas da tabela 'Offices', e
      entao compara os valores dessa coluna temporaria com os valores da coluna 'Sales'.
