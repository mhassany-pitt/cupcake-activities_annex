elements:
- type: explanation
  location:
    snippet: CREATE TABLE sailors
  explanations:
  - body: This example is to create table for sailors and everything to insert sailor it is required to check whether the
      sum of the number of sailors and the number of boats are not exceeded 100. <b>** This example is connected to the next
      example.</b>
- type: explanation
  location:
    snippet: CHECK
  explanations:
  - body: This example is to specify the total number of sailors and boats should be less 100. However, this example is WRONG.
      This check constraint which checks both 'sailor' and 'boats' tables belongs to 'sailors' table itself recursively. If
      sailors is empty, the number of Boats tuples can be anything!
- type: explanation
  location:
    snippet: ((SELECT COUNT(S.sid)
  explanations:
  - body: <b>This first example is WRONG.</b> If sailors is empty, the number of Boats tuples can be anything! It returns
      the number sailor id. The most nested query is executed firstly.
- type: explanation
  location:
    snippet: FROM sailor S) +
  explanations:
  - body: Two separate queries are linked using summation sign. Both query results are sum up.
- type: explanation
  location:
    snippet: (SELECT COUNT(B.sid)
  explanations:
  - body: This query returns the number of boats.
- type: explanation
  location:
    snippet: < 100));
  explanations:
  - body: The summed results of two subqueries is compared with '100' and if the value is less than 100, the condition is
      satisfied.
