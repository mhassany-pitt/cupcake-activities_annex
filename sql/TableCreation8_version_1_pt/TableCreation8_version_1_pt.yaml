- type: explanation
  location:
    snippet: CREATE ASSERTION smallClub
  explanations:
  - body: O exemplo anterior ('Assertion Creation (1)') verifica os valores dentro da propria tabela, o que nao e' apropriado.
      Esse exemplo explica a utilizacao do comando ASSERTION da forma correta, nao associado com nenhuma tabela. O comando
      ASSERTION e' uma restricao do banco de dados que limita o conteudo do banco como um todo. Da mesma forma que uma restricao
      CHECK, uma ASSERTION e' especificada como uma condicao de pesquisa. A diferenca entre as restricoes ASSERTION e CHECK
      e' que a condicao de pesquisa de uma ASSERTION pode restringir o conteudo de varias tabelas e o relacionamento entre
      elas. Por isso, uma ASSERTION e' especificada como parte da definicao geral do banco de dados por meio da declaracao
      CREATE ASSERTION.
- type: explanation
  location:
    snippet: CHECK
  explanations:
  - body: A palavra-chave 'CHECK' e' obrigatoria na criacao de uma assertion.
