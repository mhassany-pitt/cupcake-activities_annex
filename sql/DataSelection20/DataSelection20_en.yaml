- type: explanation
  location:
    snippet: INTERSECT
  explanations:
  - body: The INTERSECT operation produces a single table of the query results appearing in both input tables. It is important
      that the two tables must contain the same number of columns and the domain type of each column in both tables should
      be identical. <u>By default</u>, the INTERSECT operation eliminates duplicate rows as part of its processing. If you
      want to retain duplicate rows, you can specify the ALL keyword following the INTERSECT like 'INTERSECT ALL'
