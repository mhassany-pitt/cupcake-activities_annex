- type: explanation
  location:
    snippet: UNION
  explanations:
  - body: The UNION operation is to combine the results of two or more queries into a single table of query results. The major
      restriction of UNION operation is that the two tables must contain the same number of columns. It is also important
      that the domain type of each column in both tables should be identical. Because the UNION operation combines two sets
      of query results, it would tend to produce duplicate rows. However, <u>by default</u>, the UNION operation eliminates
      duplicate rows as part of its processing. If you want to retain duplicate rows, you can specify the ALL keyword following
      the UNION like 'UNION ALL.'
