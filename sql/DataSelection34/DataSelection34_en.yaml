statement: View Creation (1)
elements:
- type: explanation
  location:
    snippet: CREATE VIEW v AS
  explanations:
  - body: A VIEW is a virtual table in the database whose contents are defined by a query. To users, the VIEW appears like
      a real table, but the rows and columns of data visible through the VIEW are the query results produced by the query
      defining the VIEW. The SQL for new view should start with 'CREATE VIEW' and the name is followed. The view columns are
      defined after 'AS' keyword.
- type: explanation
  location:
    snippet: (SELECT customer_name, loan_no
  explanations:
  - body: This is the query to define view. Customers having loan and loan number are selected.
- type: explanation
  location:
    snippet: FROM borrower, loan
  explanations:
  - body: When DBMS encounters a reference to  a view in a SQL statement, it finds the definition of the view and then the
      DBMS translate the request that references the view into an equivalent request against the source tables of the view
      and carries out the equivalent requiest.
- type: explanation
  location:
    snippet: WHERE borrower.loan_no = loan.loan_no);
  explanations:
  - body: 'Views provide a variety of benefits and can be useful in many different types of databases. Views provide these
      major benefits: <ul><li>Security: Each user can be given permission to access the database only through a small set
      of views.</li><li>Query simplicity: A view can data from several different tables and present it a s a single table,
      turning multitable queries into single-table queries</li><li>Structural simplicity: Views can give a user a personalized
      view of the database structure.</li><li>Insulation from change: A view can present a consistent, unchanged image of
      the structure of the database, even if the underlying source tables are split, restructured, or renamed</li><li>Data
      Integrity: If data is accessed and entered through a view, the DBMS can automatically check the data to ensure that
      it meets specified integrity constraints</li></ul>. While views provide substantial advantages, there are also two major
      disadvantages: <ul><li>Performance: If the view is defined by a complex multitable query, then even a single query against
      the view becomes a complicated join, and it may take a long time to complete</li><li>Update restrictions: Updating rows
      of a view is possible for simple views, but more complex views cannot be updated; they are ready-only.</li></ul>'
