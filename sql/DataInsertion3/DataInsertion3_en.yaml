statement: Inserting Data (3)
elements:
- type: explanation
  location:
    snippet: INSERT INTO account
  explanations:
  - body: This examples is to create a $200 saving account for all loan customers of the Perryridge branch. Rather than specifying
      data by user, this sql is to insert data read from another table. <BR> 'account' table is defined as 'account_number',
      'branch_name', and 'balance'. By this order, the data is stored.
- type: explanation
  location:
    snippet: SELECT loan_no, branch_name, 200
  explanations:
  - body: Before executing insertion, this 'SELECT' is executed to choose the data to be stored in 'account' table. From 'loan'
      table, instances in loan_no and branch_name columns are selected and for the last 'balance' column in 'account' table,
      constance 200 is defined. Hence, all selected account has the same $200 balance.
- type: explanation
  location:
    snippet: WHERE branch_name = 'Perryridge';
  explanations:
  - body: This condition is to limit the retrieved data to 'Perryridge' branch. The domain type of 'branch_name' is character,
      so the compared value is specified by single quotation mark.
