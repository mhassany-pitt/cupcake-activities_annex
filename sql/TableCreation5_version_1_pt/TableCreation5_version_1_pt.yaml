- type: explanation
  location:
    snippet: CONSTRAINT noInterlakeRes
  explanations:
  - body: Essa e' a definicao de uma restricao CHECK. Antes de definir a restricao, e' possivel especificar um nome para ela.
      Neste caso, a restricao foi nomeada como 'noInterlakeRes'.
- type: explanation
  location:
    snippet: CHECK
  explanations:
  - body: A restricao CHECK e' uma condicao de busca que produz um valor verdadeiro/falso. Quando uma restricao CHECK e' especificada
      para uma coluna, o SGBD automaticamente verifica o valor daquela coluna toda vez que uma nova linha for inserida ou
      atualizada para garantir que a condicao de pesquisa seja verdadeira. Uma restricao CHECK de uma coluna e' especificada
      como parte da definicao da coluna dentro do comando CREATE TABLE.
- type: explanation
  location:
    snippet: ('Interlake' <>
  explanations:
  - body: Nesse exemplo, a restricao CHECK chamada de 'noInterlakeRes' e' criada para verificar se o nome do barco ('bname')
      que uma pessoa quer reservar e' "Interlake". Serve para limitar a reserva de barco "Interlake".
