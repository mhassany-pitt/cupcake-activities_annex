elements:
- type: explanation
  location:
    snippet: SELECT sid
  explanations:
  - body: No comando SELECT, as clausulas SELECT e FROM sao obrigatorias. A clausula SELECT especifica a(s) coluna(s) da tabela
      a ser(em) retornada(s). Os nomes das colunas sao separados por virgula. Nesse exemplo, somente a coluna 'sid' e' selecionada,
      por isso, nao e' necessario utilizar a virgula.
- type: explanation
  location:
    snippet: FROM Student;
  explanations:
  - body: A clausula FROM lista as tabelas que contem as tuplas a serem recuperadas pela consulta. Os dados podem ser recuperados
      a partir de uma ou varias tabelas.
