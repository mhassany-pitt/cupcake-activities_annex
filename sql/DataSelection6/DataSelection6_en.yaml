- type: explanation
  location:
    snippet: WHERE emp_no = 107;
  explanations:
  - body: Especially this SQL is to retrieve rows of data which are related to the person whose employee number is 107.<br>
      The WHERE clause is used to limit the rows you want to retrieve. The WHERE clause consists of the WHERE keyword followed
      by a search condition. The search condition can produce one of the three results. If the search condition is TRUE, the
      row is included in the query results. If the search condition is FALSE, the row is excluded from the query results.
      If the search condition has a NULL (unknown) value, the row is excluded from the query results. Basically, the search
      condition acts as a filter for rows of the table. Rows satisfying the condition pass through the filter and become part
      of the query results.
