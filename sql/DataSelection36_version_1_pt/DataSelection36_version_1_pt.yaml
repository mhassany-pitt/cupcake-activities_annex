elements:
- type: explanation
  location:
    snippet: FROM boats B, reserves R
  explanations:
  - body: As tabelas 'boats' e 'reserves' sao apelidadas de B e R, respectivamente.
- type: explanation
  location:
    snippet: WHERE R.bid = B.bid AND b.color = red
  explanations:
  - body: Essa condicao testa se os barcos ja foram reservados por meio da ligacao do ID do barco na tabela 'boats' e na tabela
      'reserves'. Alem disso, retorna apenas os barcos de cor vermelha.
- type: explanation
  location:
    snippet: GROUP BY B.bid;
  explanations:
  - body: A funcao COUNT esta trabalhando juntamente com a clausula GROUP BY. Para calcular o numero de linhas, primeiro o
      resultado e' agrupado pelo ID do barco (bid). Entao, a funcao COUNT e' executada.
