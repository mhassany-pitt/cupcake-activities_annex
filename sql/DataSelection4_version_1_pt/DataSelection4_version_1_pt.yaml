    snippet: SELECT DISTINCT name
  explanations:
  - body: A palavra-chave DISTINCT exclui tuplas do resultado da consulta e deve estar localizada antes do nome da coluna
      cujos valores duplicados serao excluidos. Se a palavra-chave DISTINCT nao for utilizada, o SQL nao exclui as linhas
      duplicadas e tem o mesmo efeito quando a palavra-chave ALL e' utilizada no lugar.
