statement: Assertion Creation (2)
elements:
- type: explanation
  location:
    snippet: CREATE ASSERTION smallClub
  explanations:
  - body: The previous example ('Assertion Creation (1)') checks the values within itself and it is inappropriate. This example
      explains ASSERTION as the right solution; not associated with either table. An ASSERTION is a database constraint that
      restricts the contents of the database as a whole. Like a CHECK constraint, an assertion is specified as a search condition.
      But the difference of ASSERTION with CHECK constraint is that the search condition in an assertion can restrict the
      contents of multiple tables and the data relationships among them. For that reaon, an ASSERTION is specified as part
      of the overall database definition, via CREATE ASSERTION statement.
