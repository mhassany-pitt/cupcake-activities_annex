elements:
- type: explanation
  location:
    snippet: UPDATE Customers
  explanations:
  - body: This example shows that not only one, more than one condition can be defined in one SQL.
- type: explanation
  location:
    snippet: WHERE cust_rep IN (105, 106, 107);
  explanations:
  - body: IN is the set membership test. It tests whether a data value matches one of a list of target values. In this example,
      if cust_rep is one of 105,106, or 107, the condition turns out TRUE.
